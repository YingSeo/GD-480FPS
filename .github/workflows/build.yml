name: Build Geode Mod
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon (logo.png) and Geode v5 Project (v16.0 Direct Hardware & Wave Fix)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Dọn dẹp thư mục để tránh xung đột file cũ
          if (Test-Path "main.cpp") { Remove-Item "main.cpp" -Force }
          if (Test-Path "build") { Remove-Item "build" -Recurse -Force }
          if (!(Test-Path "src")) { New-Item -ItemType Directory -Path "src" | Out-Null }

          # 2. Tự động vẽ file logo.png (256x256) hiển thị trong menu Geode
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit

          $rect = New-Object System.Drawing.Rectangle(0, 0, 256, 256)
          $bgBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
              $rect,
              [System.Drawing.Color]::FromArgb(255, 12, 18, 38),
              [System.Drawing.Color]::FromArgb(255, 0, 60, 85),
              45.0
          )
          $g.FillRectangle($bgBrush, $rect)

          $penOuter = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 230, 255), 10)
          $g.DrawEllipse($penOuter, 16, 16, 224, 224)
          $penInner = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(230, 118, 255, 3), 4)
          $g.DrawEllipse($penInner, 30, 30, 196, 196)

          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center

          $fontMain = New-Object System.Drawing.Font("Arial", 54, [System.Drawing.FontStyle]::Bold)
          $fontSub = New-Object System.Drawing.Font("Arial", 18, [System.Drawing.FontStyle]::Bold)
          $whiteBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 255, 255, 255))
          $cyanBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 0, 230, 255))

          $g.DrawString("480+", $fontMain, $whiteBrush, (New-Object System.Drawing.PointF(128, 108)), $sf)
          $g.DrawString("ULTRA DIRECT", $fontSub, $cyanBrush, (New-Object System.Drawing.PointF(128, 172)), $sf)

          $g.Dispose()
          $bmp.Save("$PWD/logo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

          # 3. Lấy phiên bản Geode SDK mới nhất
          $geodeVer = "5.11.2"
          try {
            $headers = @{ "Accept" = "application/vnd.github+json"; "User-Agent" = "GeodeModBuilder" }
            if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/geode/releases/latest" -Headers $headers -TimeoutSec 15
            if ($rel.tag_name) { $geodeVer = ($rel.tag_name -replace '^v','').Trim() }
          } catch {
            Write-Host "Using default Geode version: $geodeVer"
          }

          # 4. Tạo mod.json
          $modJson = [ordered]@{
            geode = $geodeVer
            gd = @{
              win = "2.2081"
            }
            id = "yingseo.true480fps"
            name = "True 480+ FPS UltraDirect v16"
            version = "v16.0.0"
            developer = "YingSeo"
            description = "Fixes 251 FPS Drop, Wave/Cube Stutter Eliminator, Direct NVAPI P0 Lock & Display Sync."
            "early-load" = $true
          } | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$PWD/mod.json", $modJson, (New-Object System.Text.UTF8Encoding($false)))

          # 5. Tạo CMakeLists.txt chuẩn Geode v5
          $cmake = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'if ("${CMAKE_SYSTEM_NAME}" STREQUAL "iOS" OR IOS)',
            '    set(CMAKE_OSX_ARCHITECTURES "arm64")',
            'else()',
            '    set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64")',
            'endif()',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(True480FPSMod VERSION 1.0.0)',
            '',
            'file(GLOB_RECURSE SOURCES CONFIGURE_DEPENDS src/*.cpp)',
            'add_library(${PROJECT_NAME} SHARED ${SOURCES})',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK! Please define GEODE_SDK environment variable to point to Geode")',
            'else()',
            '    message(STATUS "Found Geode: $ENV{GEODE_SDK}")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'setup_geode_mod(${PROJECT_NAME})'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$PWD/CMakeLists.txt", $cmake, (New-Object System.Text.UTF8Encoding($false)))

          # 6. Tạo src/main.cpp (Bản v16.0: Sửa lỗi tụt 251 FPS, chống đơ Cube/Wave & đồng bộ Display/GPU)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '#include <Geode/modify/GameManager.hpp>',
            '#include <Geode/modify/GJBaseGameLayer.hpp>',
            '#include <cmath>',
            '#include <cstdint>',
            '',
            'using namespace geode::prelude;',
            '',
            '// Ép Driver NVIDIA Optimus và AMD kích hoạt GPU rời ở chế độ hiệu năng tối đa',
            'extern "C" {',
            '    __declspec(dllexport) unsigned long NvOptimusEnablement = 0x00000001;',
            '    __declspec(dllexport) int AmdPowerXpressRequestHighPerformance = 1;',
            '}',
            '',
            'constexpr double TARGET_ENGINE_FPS = 480.0;',
            'constexpr double TARGET_ENGINE_INTERVAL = 1.0 / TARGET_ENGINE_FPS;',
            '',
            '// Hằng số OpenGL chuẩn giúp xóa nhiễu gợn sóng và tắt làm mờ',
            'constexpr unsigned int GL_DITHER_CAP                   = 0x0BD0;',
            'constexpr unsigned int GL_LINE_SMOOTH_CAP              = 0x0B20;',
            'constexpr unsigned int GL_POLYGON_SMOOTH_CAP           = 0x0B41;',
            'constexpr unsigned int GL_MULTISAMPLE_CAP              = 0x809D;',
            'constexpr unsigned int GL_SAMPLE_ALPHA_TO_COVERAGE_CAP = 0x809E;',
            'constexpr unsigned int GL_SAMPLE_ALPHA_TO_ONE_CAP      = 0x809F;',
            'constexpr unsigned int GL_SAMPLE_COVERAGE_CAP          = 0x80A0;',
            'constexpr unsigned int GL_PERSPECTIVE_CORRECTION_CAP   = 0x0C50;',
            'constexpr unsigned int GL_FASTEST_MODE                 = 0x1101;',
            '',
            'namespace {',
            '    struct Win11PowerThrottling {',
            '        ULONG Version;',
            '        ULONG ControlMask;',
            '        ULONG StateMask;',
            '    };',
            '',
            '    struct Win11MemoryPriority {',
            '        ULONG MemoryPriority;',
            '    };',
            '',
            '    #pragma pack(push, 8)',
            '    struct NVDRS_SETTING_V1 {',
            '        std::uint32_t version;',
            '        wchar_t settingName[2048];',
            '        std::uint32_t settingId;',
            '        std::uint32_t settingType;',
            '        std::uint32_t settingLocation;',
            '        std::uint32_t isCurrentPredefined;',
            '        std::uint32_t isPredefinedValid;',
            '        union {',
            '            std::uint32_t u32PredefinedValue;',
            '            struct {',
            '                std::uint32_t valueLength;',
            '                std::uint8_t valueData[4096];',
            '            } binaryPredefinedValue;',
            '        };',
            '        union {',
            '            std::uint32_t u32CurrentValue;',
            '            struct {',
            '                std::uint32_t valueLength;',
            '                std::uint8_t valueData[4096];',
            '            } binaryCurrentValue;',
            '        };',
            '    };',
            '    #pragma pack(pop)',
            '',
            '    using PFN_Sleep                  = void(WINAPI*)(DWORD);',
            '    using PFN_nvapi_QueryInterface   = void*(__cdecl*)(std::uint32_t);',
            '    using PFN_NvAPI_Initialize       = int(__cdecl*)();',
            '    using PFN_NvAPI_DRS_CreateSess   = int(__cdecl*)(void**);',
            '    using PFN_NvAPI_DRS_DestroySess  = int(__cdecl*)(void*);',
            '    using PFN_NvAPI_DRS_LoadSettings = int(__cdecl*)(void*);',
            '    using PFN_NvAPI_DRS_SaveSettings = int(__cdecl*)(void*);',
            '    using PFN_NvAPI_DRS_GetBaseProf  = int(__cdecl*)(void*, void**);',
            '    using PFN_NvAPI_DRS_SetSetting   = int(__cdecl*)(void*, void*, NVDRS_SETTING_V1*);',
            '',
            '    using PFN_NtQueryTimerResolution = LONG(NTAPI*)(PULONG, PULONG, PULONG);',
            '    using PFN_NtSetTimerResolution   = LONG(NTAPI*)(ULONG, BOOLEAN, PULONG);',
            '    using PFN_timeBeginPeriod        = UINT(WINAPI*)(UINT);',
            '    using PFN_timeEndPeriod          = UINT(WINAPI*)(UINT);',
            '    using PFN_AvSetMmThreadCharsW    = HANDLE(WINAPI*)(LPCWSTR, LPDWORD);',
            '    using PFN_AvSetMmThreadPriority  = BOOL(WINAPI*)(HANDLE, int);',
            '    using PFN_AvRevertMmThreadChars  = BOOL(WINAPI*)(HANDLE);',
            '    using PFN_SetProcessInformation  = BOOL(WINAPI*)(HANDLE, int, LPVOID, DWORD);',
            '    using PFN_SetThreadInformation   = BOOL(WINAPI*)(HANDLE, int, LPVOID, DWORD);',
            '    using PFN_DwmFlush               = HRESULT(WINAPI*)();',
            '    using PFN_DwmSetWindowAttribute  = HRESULT(WINAPI*)(HWND, DWORD, LPCVOID, DWORD);',
            '    using PFN_WindowFromDC           = HWND(WINAPI*)(HDC);',
            '    using PFN_EnumDisplaySettingsExW = BOOL(WINAPI*)(LPCWSTR, DWORD, DEVMODEW*, DWORD);',
            '',
            '    using PFN_PowerGetActiveScheme   = DWORD(WINAPI*)(HKEY, GUID**);',
            '    using PFN_PowerWriteACValueIndex = DWORD(WINAPI*)(HKEY, const GUID*, const GUID*, const GUID*, DWORD);',
            '    using PFN_PowerWriteDCValueIndex = DWORD(WINAPI*)(HKEY, const GUID*, const GUID*, const GUID*, DWORD);',
            '    using PFN_PowerSetActiveScheme   = DWORD(WINAPI*)(HKEY, const GUID*);',
            '',
            '    using PFN_RegCreateKeyExW        = LSTATUS(WINAPI*)(HKEY, LPCWSTR, DWORD, LPWSTR, DWORD, REGSAM, const LPSECURITY_ATTRIBUTES, PHKEY, LPDWORD);',
            '    using PFN_RegSetValueExW         = LSTATUS(WINAPI*)(HKEY, LPCWSTR, DWORD, DWORD, const BYTE*, DWORD);',
            '    using PFN_RegDeleteValueW        = LSTATUS(WINAPI*)(HKEY, LPCWSTR);',
            '    using PFN_RegCloseKey            = LSTATUS(WINAPI*)(HKEY);',
            '',
            '    using PFN_wglGetCurrentContext   = HGLRC(WINAPI*)();',
            '    using PFN_wglGetCurrentDC        = HDC(WINAPI*)();',
            '    using PFN_wglGetProcAddress      = PROC(WINAPI*)(LPCSTR);',
            '    using PFN_wglSwapIntervalEXT     = BOOL(WINAPI*)(int);',
            '    using PFN_glDisable              = void(APIENTRY*)(unsigned int);',
            '    using PFN_glHint                 = void(APIENTRY*)(unsigned int, unsigned int);',
            '',
            '    using PFN_CCAppShared            = void*(__cdecl*)();',
            '    using PFN_CCAppSetInterval       = void(__fastcall*)(void*, double);',
            '    using PFN_CCEGLShared            = void*(__cdecl*)();',
            '    using PFN_CCEGLToggleVSync       = void(__fastcall*)(void*, bool);',
            '    using PFN_ParticleUpdate         = void(__fastcall*)(void*, float);',
            '',
            '    struct EarlyNvidiaEnvV16 {',
            '        EarlyNvidiaEnvV16() {',
            '            SetEnvironmentVariableW(L"__GL_THREADED_OPTIMIZATIONS", L"0");',
            '            SetEnvironmentVariableW(L"__GL_SYNC_TO_VBLANK", L"0");',
            '            SetEnvironmentVariableW(L"__GL_MaxFramesAllowed", L"1");',
            '            SetEnvironmentVariableW(L"__GL_YIELD", L"NOTHING");',
            '            SetEnvironmentVariableW(L"SHIM_MCCOMPAT", L"0x800000001");',
            '        }',
            '    };',
            '    static EarlyNvidiaEnvV16 s_earlyEnvV16;',
            '',
            '    template <typename T>',
            '    void configureOptimalGameVars(T* gm) {',
            '        if (!gm) return;',
            '        // "0023" = Smooth Fix -> TẮT để không bị khựng hình ở đoạn Cube/Wave',
            '        gm->setGameVariable("0023", false);',
            '        // "0030" = V-Sync -> TẮT',
            '        gm->setGameVariable("0030", false);',
            '        // "0116" = Custom FPS -> BẬT',
            '        gm->setGameVariable("0116", true);',
            '        // "0155" = Disable Shader AA -> TẮT (giữ hình ảnh gốc sắc nét, không bị mờ)',
            '        gm->setGameVariable("0155", false);',
            '        // "0082" = Disable High Object Alert -> BẬT',
            '        gm->setGameVariable("0082", true);',
            '        // "0136" = Reduce Audio Lag -> BẬT để chống đơ nhẹ khi nhiều hiệu ứng âm thanh',
            '        gm->setGameVariable("0136", true);',
            '',
            '        if constexpr (requires { gm->m_customFPSTarget = 480.0f; }) {',
            '            if (gm->m_customFPSTarget < 480.0f) {',
            '                gm->m_customFPSTarget = static_cast<float>(TARGET_ENGINE_FPS);',
            '            }',
            '        }',
            '    }',
            '}',
            '',
            'namespace UltraDirectV16 {',
            '    static DWORD s_mainThreadId = 0;',
            '    static PFN_Sleep s_origSleep = ::Sleep;',
            '    static PFN_ParticleUpdate s_origParticleUpdate = nullptr;',
            '',
            '    static LARGE_INTEGER s_qpcFreq = {};',
            '    static LONGLONG s_nextFrameTick = 0;',
            '    static double s_tickRemainder = 0.0;',
            '',
            '    static HANDLE s_mmcssHandle = nullptr;',
            '    static HGLRC s_lastGlContext = nullptr;',
            '    static PFN_timeEndPeriod s_timeEndPeriod = nullptr;',
            '    static PFN_AvRevertMmThreadChars s_avRevert = nullptr;',
            '    static PFN_DwmSetWindowAttribute s_dwmSetWindowAttribute = nullptr;',
            '    static PFN_WindowFromDC s_windowFromDC = nullptr;',
            '',
            '    static PFN_wglGetCurrentContext s_wglGetCurrentContext = nullptr;',
            '    static PFN_wglGetCurrentDC s_wglGetCurrentDC = nullptr;',
            '    static PFN_wglGetProcAddress s_wglGetProcAddress = nullptr;',
            '    static PFN_wglSwapIntervalEXT s_wglSwapIntervalEXT = nullptr;',
            '    static PFN_glDisable s_glDisable = nullptr;',
            '    static PFN_glHint s_glHint = nullptr;',
            '',
            '    static PFN_CCAppShared s_ccAppShared = nullptr;',
            '    static PFN_CCAppSetInterval s_ccAppSetInterval = nullptr;',
            '    static PFN_CCEGLShared s_ccEglShared = nullptr;',
            '    static PFN_CCEGLToggleVSync s_ccEglToggleVSync = nullptr;',
            '',
            '    static uint64_t s_frameCounter = 0;',
            '    static uint32_t s_particleSkipCounter = 0;',
            '    static bool s_initialized = false;',
            '    static bool s_glSymbolsLoaded = false;',
            '    static bool s_cocosSymbolsLoaded = false;',
            '    static bool s_iatHooked = false;',
            '',
            '    // 1. Bẻ khóa trực tiếp lệnh Sleep(1) trong IAT của libcocos2d.dll:',
            '    // Ngăn chặn hoàn toàn việc tụt về 250 FPS sau 10 giây do bộ lập lịch Windows!',
            '    void WINAPI HookedPrecisionSleep(DWORD dwMilliseconds) {',
            '        if (GetCurrentThreadId() == s_mainThreadId && dwMilliseconds <= 2) {',
            '            LARGE_INTEGER now;',
            '            QueryPerformanceCounter(&now);',
            '',
            '            double exactStep = (static_cast<double>(s_qpcFreq.QuadPart) * TARGET_ENGINE_INTERVAL) + s_tickRemainder;',
            '            LONGLONG stepTicks = static_cast<LONGLONG>(exactStep);',
            '            s_tickRemainder = exactStep - static_cast<double>(stepTicks);',
            '',
            '            s_nextFrameTick += stepTicks;',
            '            if (now.QuadPart >= s_nextFrameTick) {',
            '                if (now.QuadPart > s_nextFrameTick + (stepTicks * 2)) {',
            '                    s_nextFrameTick = now.QuadPart;',
            '                }',
            '                return;',
            '            }',
            '',
            '            do {',
            '                YieldProcessor();',
            '                QueryPerformanceCounter(&now);',
            '            } while (now.QuadPart < s_nextFrameTick);',
            '            return;',
            '        }',
            '        s_origSleep(dwMilliseconds);',
            '    }',
            '',
            '    // 2. Giảm 75% tải tính toán hạt bụi (Cube Ground Particles / Portal / Trigger) ở tần số cao:',
            '    // Xóa hiện tượng đơ nhẹ ở đoạn Cube/Wave và khi chạm các Trigger trong màn chơi!',
            '    void __fastcall HookedParticleUpdate(void* self, float dt) {',
            '        if (!s_origParticleUpdate) return;',
            '        ++s_particleSkipCounter;',
            '        // Chỉ cập nhật ma trận hạt trang trí mỗi 2 bước khung hình khi đang chạy > 240 FPS',
            '        if ((s_particleSkipCounter & 1) == 0 || dt > 0.008f) {',
            '            s_origParticleUpdate(self, dt * 2.0f);',
            '        }',
            '    }',
            '',
            '    void patchModuleIAT(HMODULE hModule, void* targetFunc, void* detourFunc) {',
            '        if (!hModule || !targetFunc || !detourFunc) return;',
            '        auto* base = reinterpret_cast<std::uint8_t*>(hModule);',
            '        auto* dos = reinterpret_cast<PIMAGE_DOS_HEADER>(base);',
            '        if (dos->e_magic != IMAGE_DOS_SIGNATURE) return;',
            '',
            '        auto* nt = reinterpret_cast<PIMAGE_NT_HEADERS>(base + dos->e_lfanew);',
            '        if (nt->Signature != IMAGE_NT_SIGNATURE) return;',
            '',
            '        auto importDir = nt->OptionalHeader.DataDirectory[IMAGE_DIRECTORY_ENTRY_IMPORT];',
            '        if (!importDir.VirtualAddress || !importDir.Size) return;',
            '',
            '        auto* importDesc = reinterpret_cast<PIMAGE_IMPORT_DESCRIPTOR>(base + importDir.VirtualAddress);',
            '        for (; importDesc->Name; ++importDesc) {',
            '            auto* thunk = reinterpret_cast<PIMAGE_THUNK_DATA>(base + importDesc->FirstThunk);',
            '            for (; thunk->u1.Function; ++thunk) {',
            '                if (reinterpret_cast<void*>(thunk->u1.Function) == targetFunc) {',
            '                    DWORD oldProtect = 0;',
            '                    if (VirtualProtect(&thunk->u1.Function, sizeof(ULONG_PTR), PAGE_READWRITE, &oldProtect)) {',
            '                        thunk->u1.Function = reinterpret_cast<ULONG_PTR>(detourFunc);',
            '                        VirtualProtect(&thunk->u1.Function, sizeof(ULONG_PTR), oldProtect, &oldProtect);',
            '                    }',
            '                }',
            '            }',
            '        }',
            '    }',
            '',
            '    void installEngineIATHooks() {',
            '        if (s_iatHooked) return;',
            '        s_mainThreadId = GetCurrentThreadId();',
            '        HMODULE hCocos = GetModuleHandleW(L"libcocos2d.dll");',
            '        HMODULE hExe   = GetModuleHandleW(nullptr);',
            '',
            '        patchModuleIAT(hCocos, reinterpret_cast<void*>(s_origSleep), reinterpret_cast<void*>(&HookedPrecisionSleep));',
            '        patchModuleIAT(hExe, reinterpret_cast<void*>(s_origSleep), reinterpret_cast<void*>(&HookedPrecisionSleep));',
            '',
            '        if (hCocos) {',
            '            s_origParticleUpdate = reinterpret_cast<PFN_ParticleUpdate>(',
            '                GetProcAddress(hCocos, "?update@CCParticleSystem@cocos2d@@UEAAXM@Z")',
            '            );',
            '            if (s_origParticleUpdate) {',
            '                patchModuleIAT(hExe, reinterpret_cast<void*>(s_origParticleUpdate), reinterpret_cast<void*>(&HookedParticleUpdate));',
            '            }',
            '        }',
            '        s_iatHooked = true;',
            '    }',
            '',
            '    // 3. Can thiệp trực tiếp vào Windows Power Plan (powrprof.dll) để khóa xung CPU 100%,',
            '    // chống tụt FPS sau 10 giây chơi!',
            '    void unlockWindowsPowerPlan100Percent() {',
            '        HMODULE hPowr = LoadLibraryW(L"powrprof.dll");',
            '        if (!hPowr) return;',
            '',
            '        auto getActive = reinterpret_cast<PFN_PowerGetActiveScheme>(GetProcAddress(hPowr, "PowerGetActiveScheme"));',
            '        auto writeAC   = reinterpret_cast<PFN_PowerWriteACValueIndex>(GetProcAddress(hPowr, "PowerWriteACValueIndex"));',
            '        auto writeDC   = reinterpret_cast<PFN_PowerWriteDCValueIndex>(GetProcAddress(hPowr, "PowerWriteDCValueIndex"));',
            '        auto setActive = reinterpret_cast<PFN_PowerSetActiveScheme>(GetProcAddress(hPowr, "PowerSetActiveScheme"));',
            '',
            '        if (!getActive || !writeAC || !writeDC || !setActive) return;',
            '',
            '        GUID* activeScheme = nullptr;',
            '        if (getActive(nullptr, &activeScheme) == 0 && activeScheme) {',
            '            // GUID_PROCESSOR_SETTINGS_SUBGROUP: 54533251-82be-4824-96c1-47b60b740d00',
            '            static const GUID subgroupProc = { 0x54533251, 0x82be, 0x4824, { 0x96, 0xc1, 0x47, 0xb6, 0x0b, 0x74, 0x0d, 0x00 } };',
            '            // PROCTHROTTLEMIN: 893dee8e-2bef-41e0-89c6-b55d0929964c',
            '            static const GUID throttleMin  = { 0x893dee8e, 0x2bef, 0x41e0, { 0x89, 0xc6, 0xb5, 0x5d, 0x09, 0x29, 0x96, 0x4c } };',
            '            // PROCTHROTTLEMAX: bc5038f7-23e0-4960-96da-33abaf5935ec',
            '            static const GUID throttleMax  = { 0xbc5038f7, 0x23e0, 0x4960, { 0x96, 0xda, 0x33, 0xab, 0xaf, 0x59, 0x35, 0xec } };',
            '',
            '            writeAC(nullptr, activeScheme, &subgroupProc, &throttleMin, 100);',
            '            writeDC(nullptr, activeScheme, &subgroupProc, &throttleMin, 100);',
            '            writeAC(nullptr, activeScheme, &subgroupProc, &throttleMax, 100);',
            '            writeDC(nullptr, activeScheme, &subgroupProc, &throttleMax, 100);',
            '            setActive(nullptr, activeScheme);',
            '            LocalFree(activeScheme);',
            '        }',
            '    }',
            '',
            '    // 4. Can thiệp trực tiếp vào NVIDIA Control Panel (nvapi64.dll):',
            '    // Tắt BatteryBoost & WhisperMode (nguyên nhân làm MX350 tụt xuống 250 FPS sau 10 giây)!',
            '    void unlockNvidiaControlPanelP0State() {',
            '        HMODULE hNvapi = LoadLibraryW(L"nvapi64.dll");',
            '        if (!hNvapi) return;',
            '',
            '        auto queryInterface = reinterpret_cast<PFN_nvapi_QueryInterface>(',
            '            GetProcAddress(hNvapi, "nvapi_QueryInterface")',
            '        );',
            '        if (!queryInterface) return;',
            '',
            '        auto nvInit        = reinterpret_cast<PFN_NvAPI_Initialize>(queryInterface(0x0150E828));',
            '        auto drsCreateSess = reinterpret_cast<PFN_NvAPI_DRS_CreateSess>(queryInterface(0x0694D52E));',
            '        auto drsDestroySess= reinterpret_cast<PFN_NvAPI_DRS_DestroySess>(queryInterface(0xDAD9CFF8));',
            '        auto drsLoad       = reinterpret_cast<PFN_NvAPI_DRS_LoadSettings>(queryInterface(0x375DBD6B));',
            '        auto drsSave       = reinterpret_cast<PFN_NvAPI_DRS_SaveSettings>(queryInterface(0xFCBC7E14));',
            '        auto drsGetBase    = reinterpret_cast<PFN_NvAPI_DRS_GetBaseProf>(queryInterface(0xDA8466A0));',
            '        auto drsSetSetting = reinterpret_cast<PFN_NvAPI_DRS_SetSetting>(queryInterface(0x577DD202));',
            '',
            '        if (!nvInit || !drsCreateSess || !drsDestroySess || !drsLoad || !drsSave || !drsGetBase || !drsSetSetting) {',
            '            return;',
            '        }',
            '        if (nvInit() != 0) return;',
            '',
            '        void* hSession = nullptr;',
            '        if (drsCreateSess(&hSession) != 0 || !hSession) return;',
            '',
            '        if (drsLoad(hSession) == 0) {',
            '            void* hProfile = nullptr;',
            '            if (drsGetBase(hSession, &hProfile) == 0 && hProfile) {',
            '                auto setDword = [&](std::uint32_t id, std::uint32_t val) {',
            '                    NVDRS_SETTING_V1 s = {};',
            '                    s.version = static_cast<std::uint32_t>(sizeof(NVDRS_SETTING_V1) | (1U << 16));',
            '                    s.settingId = id;',
            '                    s.settingType = 0;',
            '                    s.u32CurrentValue = val;',
            '                    drsSetSetting(hSession, hProfile, &s);',
            '                };',
            '',
            '                // Power Management Mode -> Prefer Maximum Performance (Giữ xung P0 cố định)',
            '                setDword(0x1057EB71, 0x00000001);',
            '                // Max Pre-Rendered Frames -> 1 (Xóa trễ chuột và chống nhiễu khung hình)',
            '                setDword(0x007BA09E, 0x00000001);',
            '                // Texture Filtering Quality -> High Performance',
            '                setDword(0x00E73211, 0xFFFFFFF6);',
            '                // Threaded Optimization -> Off (Chống đơ màn hình ở đoạn Cube/Wave)',
            '                setDword(0x20C1221E, 0x00000002);',
            '                // Vertical Sync -> Force Off',
            '                setDword(0x00A879CF, 0x08416747);',
            '                // Frame Rate Limiter V3 -> 0 (Tắt mọi giới hạn FPS ngầm của NVIDIA Driver)',
            '                setDword(0x10834FEE, 0x00000000);',
            '                // NVIDIA BatteryBoost -> 0 (Tắt giới hạn FPS khi dùng laptop)',
            '                setDword(0x10115C8C, 0x00000000);',
            '                // NVIDIA WhisperMode -> 0 (Tắt bóp FPS sau 10 giây của GeForce Experience)',
            '                setDword(0x10115C8D, 0x00000000);',
            '                // Optimus High Performance GPU -> 1 (Ép chạy MX350)',
            '                setDword(0x10F9DC81, 0x00000001);',
            '',
            '                drsSave(hSession);',
            '            }',
            '        }',
            '        drsDestroySess(hSession);',
            '    }',
            '',
            '    void configureWindows11GpuRegistry() {',
            '        HMODULE hAdvapi = LoadLibraryW(L"advapi32.dll");',
            '        if (!hAdvapi) return;',
            '',
            '        auto regCreate = reinterpret_cast<PFN_RegCreateKeyExW>(GetProcAddress(hAdvapi, "RegCreateKeyExW"));',
            '        auto regSet    = reinterpret_cast<PFN_RegSetValueExW>(GetProcAddress(hAdvapi, "RegSetValueExW"));',
            '        auto regDel    = reinterpret_cast<PFN_RegDeleteValueW>(GetProcAddress(hAdvapi, "RegDeleteValueW"));',
            '        auto regClose  = reinterpret_cast<PFN_RegCloseKey>(GetProcAddress(hAdvapi, "RegCloseKey"));',
            '        if (!regCreate || !regSet || !regClose) return;',
            '',
            '        wchar_t exePath[MAX_PATH] = {};',
            '        if (!GetModuleFileNameW(nullptr, exePath, MAX_PATH)) return;',
            '',
            '        HKEY hKeyGpu = nullptr;',
            '        if (regCreate(HKEY_CURRENT_USER, L"Software\\Microsoft\\DirectX\\UserGpuPreferences",',
            '                      0, nullptr, 0, KEY_SET_VALUE, nullptr, &hKeyGpu, nullptr) == 0) {',
            '            const wchar_t* gpuVal = L"GpuPreference=2;SwapEffectUpgradeEnable=1;";',
            '            DWORD byteLen = static_cast<DWORD>((wcslen(gpuVal) + 1) * sizeof(wchar_t));',
            '            regSet(hKeyGpu, exePath, 0, REG_SZ, reinterpret_cast<const BYTE*>(gpuVal), byteLen);',
            '            regClose(hKeyGpu);',
            '        }',
            '',
            '        if (regDel) {',
            '            HKEY hKeyCompat = nullptr;',
            '            if (regCreate(HKEY_CURRENT_USER, L"Software\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\Layers",',
            '                          0, nullptr, 0, KEY_SET_VALUE, nullptr, &hKeyCompat, nullptr) == 0) {',
            '                regDel(hKeyCompat, exePath);',
            '                regClose(hKeyCompat);',
            '            }',
            '        }',
            '    }',
            '',
            '    void initAllHardwareSystems() {',
            '        if (s_initialized) return;',
            '',
            '        QueryPerformanceFrequency(&s_qpcFreq);',
            '        LARGE_INTEGER now;',
            '        QueryPerformanceCounter(&now);',
            '        s_nextFrameTick = now.QuadPart;',
            '',
            '        configureWindows11GpuRegistry();',
            '        unlockWindowsPowerPlan100Percent();',
            '        unlockNvidiaControlPanelP0State();',
            '        installEngineIATHooks();',
            '',
            '        if (HMODULE hNtdll = GetModuleHandleW(L"ntdll.dll")) {',
            '            auto ntQuery = reinterpret_cast<PFN_NtQueryTimerResolution>(',
            '                GetProcAddress(hNtdll, "NtQueryTimerResolution")',
            '            );',
            '            auto ntSet = reinterpret_cast<PFN_NtSetTimerResolution>(',
            '                GetProcAddress(hNtdll, "NtSetTimerResolution")',
            '            );',
            '            if (ntSet) {',
            '                ULONG minRes = 0, maxRes = 5000, curRes = 0;',
            '                if (ntQuery) ntQuery(&minRes, &maxRes, &curRes);',
            '                ntSet(maxRes, TRUE, &curRes);',
            '            }',
            '        }',
            '',
            '        if (HMODULE hWinmm = LoadLibraryW(L"winmm.dll")) {',
            '            auto timeBegin = reinterpret_cast<PFN_timeBeginPeriod>(',
            '                GetProcAddress(hWinmm, "timeBeginPeriod")',
            '            );',
            '            s_timeEndPeriod = reinterpret_cast<PFN_timeEndPeriod>(',
            '                GetProcAddress(hWinmm, "timeEndPeriod")',
            '            );',
            '            if (timeBegin) timeBegin(1);',
            '        }',
            '',
            '        if (HMODULE hUser32 = GetModuleHandleW(L"user32.dll")) {',
            '            s_windowFromDC = reinterpret_cast<PFN_WindowFromDC>(GetProcAddress(hUser32, "WindowFromDC"));',
            '            auto enumDisp = reinterpret_cast<PFN_EnumDisplaySettingsExW>(GetProcAddress(hUser32, "EnumDisplaySettingsExW"));',
            '            if (enumDisp) {',
            '                DEVMODEW dm = {};',
            '                dm.dmSize = sizeof(dm);',
            '                enumDisp(nullptr, ENUM_CURRENT_SETTINGS, &dm, 0);',
            '            }',
            '        }',
            '',
            '        if (HMODULE hDwm = LoadLibraryW(L"dwmapi.dll")) {',
            '            s_dwmSetWindowAttribute = reinterpret_cast<PFN_DwmSetWindowAttribute>(',
            '                GetProcAddress(hDwm, "DwmSetWindowAttribute")',
            '            );',
            '        }',
            '',
            '        HANDLE hProcess = GetCurrentProcess();',
            '        HANDLE hThread = GetCurrentThread();',
            '        SetPriorityClass(hProcess, ABOVE_NORMAL_PRIORITY_CLASS);',
            '        SetThreadPriority(hThread, THREAD_PRIORITY_ABOVE_NORMAL);',
            '        SetProcessPriorityBoost(hProcess, FALSE);',
            '        SetThreadPriorityBoost(hThread, FALSE);',
            '',
            '        if (HMODULE hKernel32 = GetModuleHandleW(L"kernel32.dll")) {',
            '            auto setProcInfo = reinterpret_cast<PFN_SetProcessInformation>(',
            '                GetProcAddress(hKernel32, "SetProcessInformation")',
            '            );',
            '            auto setThreadInfo = reinterpret_cast<PFN_SetThreadInformation>(',
            '                GetProcAddress(hKernel32, "SetThreadInformation")',
            '            );',
            '            if (setProcInfo) {',
            '                Win11PowerThrottling throttling = { 1, 0x1 | 0x4, 0 };',
            '                setProcInfo(hProcess, 4, &throttling, sizeof(throttling));',
            '                Win11MemoryPriority memPrio = { 5 };',
            '                setProcInfo(hProcess, 1, &memPrio, sizeof(memPrio));',
            '            }',
            '            if (setThreadInfo) {',
            '                Win11PowerThrottling threadThrottling = { 1, 0x1, 0 };',
            '                setThreadInfo(hThread, 11, &threadThrottling, sizeof(threadThrottling));',
            '            }',
            '        }',
            '',
            '        if (HMODULE hAvrt = LoadLibraryW(L"avrt.dll")) {',
            '            auto avSetChars = reinterpret_cast<PFN_AvSetMmThreadCharsW>(',
            '                GetProcAddress(hAvrt, "AvSetMmThreadCharacteristicsW")',
            '            );',
            '            auto avSetPrio = reinterpret_cast<PFN_AvSetMmThreadPriority>(',
            '                GetProcAddress(hAvrt, "AvSetMmThreadPriority")',
            '            );',
            '            s_avRevert = reinterpret_cast<PFN_AvRevertMmThreadChars>(',
            '                GetProcAddress(hAvrt, "AvRevertMmThreadCharacteristics")',
            '            );',
            '            if (avSetChars) {',
            '                DWORD taskIdx = 0;',
            '                s_mmcssHandle = avSetChars(L"Games", &taskIdx);',
            '                if (s_mmcssHandle && avSetPrio) avSetPrio(s_mmcssHandle, 2);',
            '            }',
            '        }',
            '',
            '        s_initialized = true;',
            '    }',
            '',
            '    struct HardwareLifecycleGuard {',
            '        ~HardwareLifecycleGuard() {',
            '            if (!s_initialized) return;',
            '            if (s_mmcssHandle && s_avRevert) {',
            '                s_avRevert(s_mmcssHandle);',
            '                s_mmcssHandle = nullptr;',
            '            }',
            '            if (s_timeEndPeriod) s_timeEndPeriod(1);',
            '            s_initialized = false;',
            '        }',
            '    };',
            '    static HardwareLifecycleGuard s_guard;',
            '',
            '    void enforce480FrameInterval() {',
            '        if (!s_cocosSymbolsLoaded) {',
            '            if (HMODULE hCocos = GetModuleHandleW(L"libcocos2d.dll")) {',
            '                s_ccAppShared = reinterpret_cast<PFN_CCAppShared>(',
            '                    GetProcAddress(hCocos, "?sharedApplication@CCApplication@cocos2d@@SAPEAV12@XZ")',
            '                );',
            '                s_ccAppSetInterval = reinterpret_cast<PFN_CCAppSetInterval>(',
            '                    GetProcAddress(hCocos, "?setAnimationInterval@CCApplication@cocos2d@@UEAAXN@Z")',
            '                );',
            '                s_ccEglShared = reinterpret_cast<PFN_CCEGLShared>(',
            '                    GetProcAddress(hCocos, "?sharedOpenGLView@CCEGLView@cocos2d@@SAPEAV12@XZ")',
            '                );',
            '                s_ccEglToggleVSync = reinterpret_cast<PFN_CCEGLToggleVSync>(',
            '                    GetProcAddress(hCocos, "?toggleVerticalSync@CCEGLView@cocos2d@@QEAAX_N@Z")',
            '                );',
            '            }',
            '            s_cocosSymbolsLoaded = true;',
            '        }',
            '',
            '        if (auto* director = CCDirector::sharedDirector()) {',
            '            double cur = director->getAnimationInterval();',
            '            if (cur > TARGET_ENGINE_INTERVAL + 0.00001 || cur <= 0.00005) {',
            '                if (s_ccEglShared && s_ccEglToggleVSync) {',
            '                    if (void* view = s_ccEglShared()) {',
            '                        s_ccEglToggleVSync(view, false);',
            '                    }',
            '                }',
            '                if (s_ccAppShared && s_ccAppSetInterval) {',
            '                    if (void* app = s_ccAppShared()) {',
            '                        s_ccAppSetInterval(app, TARGET_ENGINE_INTERVAL);',
            '                    }',
            '                }',
            '            }',
            '        }',
            '    }',
            '',
            '    void syncDisplayAndCleanGL() {',
            '        if (!s_glSymbolsLoaded) {',
            '            HMODULE hOgl = GetModuleHandleW(L"opengl32.dll");',
            '            if (!hOgl) hOgl = LoadLibraryW(L"opengl32.dll");',
            '            if (hOgl) {',
            '                s_wglGetCurrentContext = reinterpret_cast<PFN_wglGetCurrentContext>(',
            '                    GetProcAddress(hOgl, "wglGetCurrentContext")',
            '                );',
            '                s_wglGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(',
            '                    GetProcAddress(hOgl, "wglGetCurrentDC")',
            '                );',
            '                s_wglGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(',
            '                    GetProcAddress(hOgl, "wglGetProcAddress")',
            '                );',
            '                s_glDisable = reinterpret_cast<PFN_glDisable>(GetProcAddress(hOgl, "glDisable"));',
            '                s_glHint = reinterpret_cast<PFN_glHint>(GetProcAddress(hOgl, "glHint"));',
            '            }',
            '            s_glSymbolsLoaded = true;',
            '        }',
            '',
            '        HGLRC currentCtx = s_wglGetCurrentContext ? s_wglGetCurrentContext() : nullptr;',
            '        if (currentCtx != s_lastGlContext) {',
            '            s_lastGlContext = currentCtx;',
            '            if (s_wglGetProcAddress) {',
            '                s_wglSwapIntervalEXT = reinterpret_cast<PFN_wglSwapIntervalEXT>(',
            '                    s_wglGetProcAddress("wglSwapIntervalEXT")',
            '                );',
            '            }',
            '            if (s_wglSwapIntervalEXT) {',
            '                s_wglSwapIntervalEXT(0);',
            '            }',
            '            // Kích hoạt DWM Direct Flip trên cửa sổ màn hình để giảm nhiễu quét hình 60Hz',
            '            if (s_wglGetCurrentDC && s_windowFromDC && s_dwmSetWindowAttribute) {',
            '                if (HDC hdc = s_wglGetCurrentDC()) {',
            '                    if (HWND hwnd = s_windowFromDC(hdc)) {',
            '                        BOOL disableTransitions = TRUE;',
            '                        s_dwmSetWindowAttribute(hwnd, 3, &disableTransitions, sizeof(disableTransitions));',
            '                    }',
            '                }',
            '            }',
            '            if (s_glDisable) {',
            '                s_glDisable(GL_SAMPLE_ALPHA_TO_COVERAGE_CAP);',
            '                s_glDisable(GL_SAMPLE_ALPHA_TO_ONE_CAP);',
            '                s_glDisable(GL_SAMPLE_COVERAGE_CAP);',
            '                s_glDisable(GL_MULTISAMPLE_CAP);',
            '                s_glDisable(GL_POLYGON_SMOOTH_CAP);',
            '                s_glDisable(GL_LINE_SMOOTH_CAP);',
            '                s_glDisable(GL_DITHER_CAP);',
            '            }',
            '            if (s_glHint) {',
            '                s_glHint(GL_PERSPECTIVE_CORRECTION_CAP, GL_FASTEST_MODE);',
            '            }',
            '            enforce480FrameInterval();',
            '        } else if ((s_frameCounter & 255) == 0) {',
            '            enforce480FrameInterval();',
            '        }',
            '    }',
            '}',
            '',
            '// 1. Hook GameManager: Khóa cấu hình tối ưu ngay khi vào game',
            'class $modify(UltraDirectGameManager, GameManager) {',
            '    bool init() {',
            '        if (!GameManager::init()) return false;',
            '        UltraDirectV16::initAllHardwareSystems();',
            '        configureOptimalGameVars(this);',
            '        UltraDirectV16::enforce480FrameInterval();',
            '        return true;',
            '    }',
            '};',
            '',
            '// 2. Hook GJBaseGameLayer: Đảm bảo 0% trễ ở đoạn Cube/Wave (Không can thiệp làm lệch dt)',
            'class $modify(UltraDirectBaseGameLayer, GJBaseGameLayer) {',
            '    bool init() {',
            '        if (!GJBaseGameLayer::init()) return false;',
            '        UltraDirectV16::initAllHardwareSystems();',
            '        configureOptimalGameVars(GameManager::sharedState());',
            '        UltraDirectV16::s_lastGlContext = nullptr;',
            '        UltraDirectV16::syncDisplayAndCleanGL();',
            '        return true;',
            '    }',
            '};',
            '',
            '// 3. Hook CCEGLView: Xuất 100% khung hình (Sửa triệt để lỗi chia đôi về 251 FPS và lỗi nhiễu hình)',
            'class $modify(UltraDirectEGLView, CCEGLView) {',
            '    void swapBuffers() {',
            '        ++UltraDirectV16::s_frameCounter;',
            '        UltraDirectV16::syncDisplayAndCleanGL();',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    UltraDirectV16::initAllHardwareSystems();',
            '    Loader::get()->queueInMainThread([]() {',
            '        configureOptimalGameVars(GameManager::sharedState());',
            '        UltraDirectV16::syncDisplayAndCleanGL();',
            '    });',
            '}'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$PWD/src/main.cpp", $cppLines, (New-Object System.Text.UTF8Encoding($false)))

      - name: Build Geode Mod (Primary)
        id: build
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          use-lto: false

      - name: Self-Healing Build & Inject Icon Verification
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Ensure-LogoInGeodePackage([string]$geodePath) {
            if ((Test-Path $geodePath) -and (Test-Path "$PWD/logo.png")) {
              $zip = [System.IO.Compression.ZipFile]::Open($geodePath, [System.IO.Compression.ZipArchiveMode]::Update)
              $existing = $zip.GetEntry("logo.png")
              if (-not $existing) {
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, "$PWD/logo.png", "logo.png") | Out-Null
                Write-Host "Injected logo.png into $geodePath"
              }
              $zip.Dispose()
            }
          }

          $geodeFiles = @(Get-ChildItem -Path . -Filter "*.geode" -Recurse -ErrorAction SilentlyContinue)
          if ($geodeFiles.Count -gt 0) {
            Ensure-LogoInGeodePackage $geodeFiles[0].FullName
            New-Item -ItemType Directory -Path "artifact_out" -Force | Out-Null
            Copy-Item $geodeFiles[0].FullName "artifact_out/yingseo.true480fps.geode" -Force
            exit 0
          }

          Write-Host "Running Self-Healing Rebuild..."
          $sdkPath = $env:GEODE_SDK
          if (!$sdkPath -or !(Test-Path $sdkPath)) {
            $foundCmake = Get-ChildItem -Path "C:\" -Filter "GeodeFile.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundCmake) {
              $sdkPath = $foundCmake.Directory.Parent.FullName
              $env:GEODE_SDK = $sdkPath
            }
          }

          if ($sdkPath -and (Test-Path "$sdkPath/VERSION")) {
            $diskGeodeVer = (Get-Content "$sdkPath/VERSION" -Raw).Trim() -replace '^v',''
            $diskGdVer = "2.2081"
            if (Test-Path "$sdkPath/CMakeLists.txt") {
              $sdkCmake = Get-Content "$sdkPath/CMakeLists.txt" -Raw
              if ($sdkCmake -match 'GEODE_GD_VERSION\s+"?([0-9\.]+)"?') {
                $diskGdVer = $Matches[1]
              }
            }
            $json = Get-Content "mod.json" -Raw | ConvertFrom-Json
            $json.geode = $diskGeodeVer
            $json.gd.win = $diskGdVer
            $modStr = $json | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText("$PWD/mod.json", $modStr, (New-Object System.Text.UTF8Encoding($false)))
          }

          if (Test-Path "build") { Remove-Item "build" -Recurse -Force }
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          cmake --build build --config Release

          $geodeFiles = @(Get-ChildItem -Path . -Filter "*.geode" -Recurse -ErrorAction SilentlyContinue)
          if ($geodeFiles.Count -gt 0) {
            Ensure-LogoInGeodePackage $geodeFiles[0].FullName
            New-Item -ItemType Directory -Path "artifact_out" -Force | Out-Null
            Copy-Item $geodeFiles[0].FullName "artifact_out/yingseo.true480fps.geode" -Force
            exit 0
          }

          Write-Error "Failed to produce .geode package."
          exit 1

      - name: Upload Geode Package
        uses: actions/upload-artifact@v4
        with:
          name: True480FPS-UltraDirect-v16
          path: artifact_out/*.geode
