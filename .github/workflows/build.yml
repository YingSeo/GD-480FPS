name: Build Geode Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Geode CLI
        uses: geode-sdk/install-geode-cli@main

      - name: Build Mod
        run: geode package new --binary-only || geode build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: True480FPSMod
          path: build/*.geode
