name: Build Geode Mod
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Sync Geode SDK and Prepare Files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Đồng bộ thông minh giữa main.cpp (gốc) và src/main.cpp
          if (!(Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" | Out-Null
          }
          $changed = git diff-tree --no-commit-id --name-only -r HEAD 2>$null
          if ($changed -contains "main.cpp") {
            Copy-Item "main.cpp" "src/main.cpp" -Force
          } elseif ((Test-Path "main.cpp") -and !(Test-Path "src/main.cpp")) {
            Copy-Item "main.cpp" "src/main.cpp" -Force
          }

          # 2. Lấy chính xác phiên bản Geode SDK & GD Windows bằng GITHUB_TOKEN (Không bị Rate-Limit)
          $geodeVer = "4.4.0"
          $gdWinVer = "2.2081"
          try {
            $headers = @{
              "Accept" = "application/vnd.github+json"
              "User-Agent" = "GeodeModBuilder"
            }
            if ($env:GH_TOKEN) {
              $headers["Authorization"] = "Bearer $env:GH_TOKEN"
            }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/geode/releases/latest" -Headers $headers -TimeoutSec 15
            if ($rel.tag_name) {
              $geodeVer = $rel.tag_name -replace '^v',''
              $loaderUrl = "https://raw.githubusercontent.com/geode-sdk/geode/$($rel.tag_name)/loader/mod.json"
              $loaderMod = Invoke-RestMethod -Uri $loaderUrl -TimeoutSec 15
              if ($loaderMod.gd -and $loaderMod.gd.win) {
                $gdWinVer = $loaderMod.gd.win
              }
            }
          } catch {
            Write-Host "Fallback to verified Geode SDK: $geodeVer ($gdWinVer)"
          }

          Write-Host "Building with Geode SDK: $geodeVer | GD Target: $gdWinVer"

          # 3. Tạo mod.json chuẩn xác (UTF-8 No BOM)
          $modJson = [ordered]@{
            geode = $geodeVer
            gd = @{
              win = $gdWinVer
            }
            id = "yingseo.true480fps"
            name = "True 480+ FPS Titanium Engine"
            version = "v9.0.0"
            developer = "YingSeo"
            description = "True 480+ FPS Unlocker, Frame-Perfect Bypass, Anti-Blur/MSAA & Win11 0.5ms Kernel Boost."
            "early-load" = $true
          } | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$PWD/mod.json", $modJson, (New-Object System.Text.UTF8Encoding($false)))

          # 4. Tạo CMakeLists.txt chuẩn Geode SDK
          $cmake = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 20)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            'project(True480FPSMod VERSION 9.0.0)',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'if (WIN32)',
            '    target_compile_definitions(${PROJECT_NAME} PRIVATE WIN32_LEAN_AND_MEAN NOMINMAX)',
            '    target_link_libraries(${PROJECT_NAME} PRIVATE user32 gdi32 opengl32)',
            'endif()',
            'setup_geode_mod(${PROJECT_NAME})'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$PWD/CMakeLists.txt", $cmake, (New-Object System.Text.UTF8Encoding($false)))

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload Geode Package
        uses: actions/upload-artifact@v4
        with:
          name: True480FPS-Titanium-v9
          path: |
            ${{ steps.build.outputs.build-output }}
            build/*.geode
