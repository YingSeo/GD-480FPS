            '',
            '    DWORD lastPid = 0;',
            '    int tick = 0;',
            '    while (true) {',
            '        if (GetAsyncKeyState(VK_F1) & 1) {',
            '            if (ipc) { ipc->targetFps = 240.0f; ipc->forceFlush = 1; }',
            '            std::printf(" [>] Che do: 240.0 FPS LOCK (4:1 V-Blank Sync)\n");',
            '        }',
            '        if (GetAsyncKeyState(VK_F2) & 1) {',
            '            if (ipc) { ipc->targetFps = 360.0f; ipc->forceFlush = 1; }',
            '            std::printf(" [>] Che do: 360.0 FPS BYPASS (6:1 V-Blank Sync)\n");',
            '        }',
            '        if (GetAsyncKeyState(VK_F3) & 1) {',
            '            if (ipc) { ipc->targetFps = 480.0f; ipc->forceFlush = 1; }',
            '            std::printf(" [>] Che do: 480.0 FPS BYPASS (8:1 V-Blank Sync)\n");',
            '        }',
            '        if (GetAsyncKeyState(VK_F5) & 1) {',
            '            if (ipc) {',
            '                ipc->vblankSync = (ipc->vblankSync == 0) ? 1 : 0;',
            '                ipc->forceFlush = 1;',
            '                std::printf(" [>] 4:1 Hardware V-Blank Anti-Tear: %s\n",',
            '                            (ipc->vblankSync != 0) ? "BAT (0%% Soc man hinh)" : "TAT (Raw Uncapped)");',
            '            }',
            '        }',
            '        if (GetAsyncKeyState(VK_F6) & 1) {',
            '            DWORD pid = FindGeometryDashPID();',
            '            BoostGeometryDashProcess(pid, true);',
            '            if (ipc) { ipc->forceFlush = 1; }',
            '            std::printf(" [>] Da giai phong RAM ngam cho may 8GB!\n");',
            '        }',
            '',
            '        if (++tick >= 20) {',
            '            tick = 0;',
            '            DWORD pid = FindGeometryDashPID();',
            '            if (pid != 0 && pid != lastPid) {',
            '                lastPid = pid;',
            '                BoostGeometryDashProcess(pid, true);',
            '                std::printf(" [+] Da ket noi GeometryDash.exe (PID: %lu) - 4:1 V-Blank Sync Active!\n", pid);',
            '            } else if (pid == 0 && lastPid != 0) {',
            '                lastPid = 0;',
            '                std::printf(" [-] GeometryDash.exe da dong. Dang cho mo lai game...\n");',
            '            }',
            '        }',
            '        Sleep(50);',
            '    }',
            '    return 0;',
            '}'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$extSrcDir/booster.cpp", $extCpp, (New-Object System.Text.UTF8Encoding($false)))

          $extCmake = @(
            'cmake_minimum_required(VERSION 3.21)',
            'project(GDExternalBooster LANGUAGES CXX)',
            'set(CMAKE_CXX_STANDARD 20)',
            'add_executable(GD-External-FPS-Booster booster.cpp)'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$extSrcDir/CMakeLists.txt", $extCmake, (New-Object System.Text.UTF8Encoding($false)))

          cmake -S "$extSrcDir" -B "$extBldDir" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$extBldDir" --config Release
          $exeFile = Get-ChildItem -Path "$extBldDir" -Filter "GD-External-FPS-Booster.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exeFile) {
            Copy-Item $exeFile.FullName "artifact_out/GD-External-FPS-Booster.exe" -Force
          }

          # 2. Kiểm tra và đóng gói file .geode
          $geodeFiles = @(Get-ChildItem -Path . -Filter "*.geode" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "artifact_out" })
          if ($geodeFiles.Count -gt 0) {
            Ensure-LogoInGeodePackage $geodeFiles[0].FullName
            Copy-Item $geodeFiles[0].FullName "artifact_out/yingseo.true480fps.geode" -Force
            exit 0
          }

          Write-Host "Running Self-Healing Rebuild..."
          $sdkPath = $env:GEODE_SDK
          if (!$sdkPath -or !(Test-Path $sdkPath)) {
            $foundCmake = Get-ChildItem -Path "C:\" -Filter "GeodeFile.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundCmake) {
              $sdkPath = $foundCmake.Directory.Parent.FullName
              $env:GEODE_SDK = $sdkPath
            }
          }

          if ($sdkPath -and (Test-Path "$sdkPath/VERSION")) {
            $diskGeodeVer = (Get-Content "$sdkPath/VERSION" -Raw).Trim() -replace '^v',''
            $diskGdVer = "2.2081"
            if (Test-Path "$sdkPath/CMakeLists.txt") {
              $sdkCmake = Get-Content "$sdkPath/CMakeLists.txt" -Raw
              if ($sdkCmake -match 'GEODE_GD_VERSION\s+"?([0-9\.]+)"?') {
                $diskGdVer = $Matches[1]
              }
            }
            $json = Get-Content "mod.json" -Raw | ConvertFrom-Json
            $json.geode = $diskGeodeVer
            $json.gd.win = $diskGdVer
            $modStr = $json | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText("$PWD/mod.json", $modStr, (New-Object System.Text.UTF8Encoding($false)))
          }

          if (Test-Path "build") { Remove-Item "build" -Recurse -Force }
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          cmake --build build --config Release

          $geodeFiles = @(Get-ChildItem -Path . -Filter "*.geode" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "artifact_out" })
          if ($geodeFiles.Count -gt 0) {
            Ensure-LogoInGeodePackage $geodeFiles[0].FullName
            Copy-Item $geodeFiles[0].FullName "artifact_out/yingseo.true480fps.geode" -Force
            exit 0
          }

          Write-Error "Failed to produce .geode package."
          exit 1

      - name: Upload Mod and External Tool Suite
        uses: actions/upload-artifact@v4
        with:
          name: True240FPS-VBlankSuite-v21
          path: artifact_out/*
