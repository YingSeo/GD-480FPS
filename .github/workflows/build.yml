name: Build Geode Mod & External Booster Tool
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Mod (v20.0) and External 10x Frame-Perfect Tool
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path "main.cpp") { Remove-Item "main.cpp" -Force }
          if (Test-Path "build") { Remove-Item "build" -Recurse -Force }
          if (Test-Path "external_tool") { Remove-Item "external_tool" -Recurse -Force }
          if (Test-Path "ext_build") { Remove-Item "ext_build" -Recurse -Force }
          if (!(Test-Path "src")) { New-Item -ItemType Directory -Path "src" | Out-Null }

          # 1. Tự động vẽ Icon logo.png (256x256) cho Geode Mod v20.0
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit

          $rect = New-Object System.Drawing.Rectangle(0, 0, 256, 256)
          $bgBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
              $rect,
              [System.Drawing.Color]::FromArgb(255, 12, 14, 34),
              [System.Drawing.Color]::FromArgb(255, 28, 12, 64),
              45.0
          )
          $g.FillRectangle($bgBrush, $rect)

          $penOuter = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 245, 255), 10)
          $g.DrawEllipse($penOuter, 16, 16, 224, 224)
          $penInner = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(240, 255, 190, 0), 4)
          $g.DrawEllipse($penInner, 30, 30, 196, 196)

          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center

          $fontMain = New-Object System.Drawing.Font("Arial", 54, [System.Drawing.FontStyle]::Bold)
          $fontSub = New-Object System.Drawing.Font("Arial", 17, [System.Drawing.FontStyle]::Bold)
          $whiteBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 255, 255, 255))
          $goldBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 255, 210, 0))

          $g.DrawString("240", $fontMain, $whiteBrush, (New-Object System.Drawing.PointF(128, 104)), $sf)
          $g.DrawString("10X PERFECT", $fontSub, $goldBrush, (New-Object System.Drawing.PointF(128, 172)), $sf)

          $g.Dispose()
          $bmp.Save("$PWD/logo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

          # 2. Lấy phiên bản Geode SDK mới nhất
          $geodeVer = "5.11.2"
          try {
            $headers = @{ "Accept" = "application/vnd.github+json"; "User-Agent" = "GeodeModBuilder" }
            if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/geode/releases/latest" -Headers $headers -TimeoutSec 15
            if ($rel.tag_name) { $geodeVer = ($rel.tag_name -replace '^v','').Trim() }
          } catch {
            Write-Host "Using default Geode version: $geodeVer"
          }

          # 3. Tạo mod.json
          $modJson = [ordered]@{
            geode = $geodeVer
            gd = @{
              win = "2.2081"
            }
            id = "yingseo.true480fps"
            name = "True 240 FPS 10x Frame-Perfect v20"
            version = "v20.0.0"
            developer = "YingSeo"
            description = "240 FPS Hard-Lock, 2400Hz 10x Frame-Perfect Input Engine & DWM Mailbox Anti-Tear."
            "early-load" = $true
          } | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$PWD/mod.json", $modJson, (New-Object System.Text.UTF8Encoding($false)))

          # 4. Tạo CMakeLists.txt chuẩn Geode v5
          $cmake = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'if ("${CMAKE_SYSTEM_NAME}" STREQUAL "iOS" OR IOS)',
            '    set(CMAKE_OSX_ARCHITECTURES "arm64")',
            'else()',
            '    set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64")',
            'endif()',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(True240FPSMod VERSION 1.0.0)',
            '',
            'file(GLOB_RECURSE SOURCES CONFIGURE_DEPENDS src/*.cpp)',
            'add_library(${PROJECT_NAME} SHARED ${SOURCES})',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'setup_geode_mod(${PROJECT_NAME})'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$PWD/CMakeLists.txt", $cmake, (New-Object System.Text.UTF8Encoding($false)))

          # 5. Tạo src/main.cpp (Bản v20.0: DWM Mailbox Anti-Tear + 2400Hz 10x Frame-Perfect Engine)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '#include <Geode/modify/GameManager.hpp>',
            '#include <Geode/modify/GJBaseGameLayer.hpp>',
            '#include <atomic>',
            '#include <thread>',
            '#include <cmath>',
            '#include <cstdint>',
            '',
            'using namespace geode::prelude;',
            '',
            '// Ép Driver NVIDIA Optimus chạy trên card rời GeForce MX350',
            'extern "C" {',
            '    __declspec(dllexport) unsigned long NvOptimusEnablement = 0x00000001;',
            '    __declspec(dllexport) int AmdPowerXpressRequestHighPerformance = 1;',
            '}',
            '',
            'constexpr double DEFAULT_240_FPS = 240.0;',
            '',
            'constexpr unsigned int GL_DITHER_CAP                   = 0x0BD0;',
            'constexpr unsigned int GL_LINE_SMOOTH_CAP              = 0x0B20;',
            'constexpr unsigned int GL_POLYGON_SMOOTH_CAP           = 0x0B41;',
            'constexpr unsigned int GL_MULTISAMPLE_CAP              = 0x809D;',
            'constexpr unsigned int GL_SAMPLE_ALPHA_TO_COVERAGE_CAP = 0x809E;',
            'constexpr unsigned int GL_PERSPECTIVE_CORRECTION_CAP   = 0x0C50;',
            'constexpr unsigned int GL_FASTEST_MODE                 = 0x1101;',
            '',
            'namespace {',
            '    // Cấu trúc bộ nhớ chia sẻ (IPC) giao tiếp trực tiếp giữa Mod và Tool bên ngoài',
            '    struct SharedBoosterIPC {',
            '        std::uint32_t magic;            // 0x47443230 ("GD20")',
            '        float         targetFps;        // 240.0f, 360.0f, 480.0f',
            '        std::uint32_t subFrameMult;     // 4 = 960Hz TPS, 8 = 1920Hz TPS, 10 = 2400Hz 10x Frame-Perfect',
            '        std::uint32_t antiTearMode;     // 1 = Bật DWM Mailbox Compositor chống sọc nhiễu 100%',
            '        std::uint32_t forceFlush;       // 1 = Làm mới cấu hình ngay lập tức',
            '        std::uint32_t detectedClicks;   // Bộ đếm số pha Click 2400Hz gửi ra Tool bên ngoài',
            '    };',
            '',
            '    struct Win11PowerThrottling {',
            '        ULONG Version;',
            '        ULONG ControlMask;',
            '        ULONG StateMask;',
            '    };',
            '',
            '    struct DWM_MARGINS {',
            '        int cxLeftWidth;',
            '        int cxRightWidth;',
            '        int cyTopHeight;',
            '        int cyBottomHeight;',
            '    };',
            '',
            '    #pragma pack(push, 8)',
            '    struct NVDRS_SETTING_V1 {',
            '        std::uint32_t version;',
            '        wchar_t settingName[2048];',
            '        std::uint32_t settingId;',
            '        std::uint32_t settingType;',
            '        std::uint32_t settingLocation;',
            '        std::uint32_t isCurrentPredefined;',
            '        std::uint32_t isPredefinedValid;',
            '        union {',
            '            std::uint32_t u32PredefinedValue;',
            '            struct {',
            '                std::uint32_t valueLength;',
            '                std::uint8_t valueData[4096];',
            '            } binaryPredefinedValue;',
            '        };',
            '        union {',
            '            std::uint32_t u32CurrentValue;',
            '            struct {',
            '                std::uint32_t valueLength;',
            '                std::uint8_t valueData[4096];',
            '            } binaryCurrentValue;',
            '        };',
            '    };',
            '    #pragma pack(pop)',
            '',
            '    using PFN_Sleep                      = void(WINAPI*)(DWORD);',
            '    using PFN_nvapi_QueryInterface       = void*(__cdecl*)(std::uint32_t);',
            '    using PFN_NvAPI_Initialize           = int(__cdecl*)();',
            '    using PFN_NvAPI_DRS_CreateSess       = int(__cdecl*)(void**);',
            '    using PFN_NvAPI_DRS_DestroySess      = int(__cdecl*)(void*);',
            '    using PFN_NvAPI_DRS_LoadSettings     = int(__cdecl*)(void*);',
            '    using PFN_NvAPI_DRS_SaveSettings     = int(__cdecl*)(void*);',
            '    using PFN_NvAPI_DRS_GetBaseProf      = int(__cdecl*)(void*, void**);',
            '    using PFN_NvAPI_DRS_SetSetting       = int(__cdecl*)(void*, void*, NVDRS_SETTING_V1*);',
            '',
            '    using PFN_NtQueryTimerResolution     = LONG(NTAPI*)(PULONG, PULONG, PULONG);',
            '    using PFN_NtSetTimerResolution       = LONG(NTAPI*)(ULONG, BOOLEAN, PULONG);',
            '    using PFN_timeBeginPeriod            = UINT(WINAPI*)(UINT);',
            '    using PFN_timeEndPeriod              = UINT(WINAPI*)(UINT);',
            '    using PFN_AvSetMmThreadCharsW        = HANDLE(WINAPI*)(LPCWSTR, LPDWORD);',
            '    using PFN_AvSetMmThreadPriority      = BOOL(WINAPI*)(HANDLE, int);',
            '    using PFN_AvRevertMmThreadChars      = BOOL(WINAPI*)(HANDLE);',
            '    using PFN_SetProcessInformation      = BOOL(WINAPI*)(HANDLE, int, LPVOID, DWORD);',
            '',
            '    using PFN_DwmSetWindowAttribute      = HRESULT(WINAPI*)(HWND, DWORD, LPCVOID, DWORD);',
            '    using PFN_DwmExtendFrameIntoClient   = HRESULT(WINAPI*)(HWND, const DWM_MARGINS*);',
            '    using PFN_WindowFromDC               = HWND(WINAPI*)(HDC);',
            '    using PFN_GetWindowLongPtrW          = LONG_PTR(WINAPI*)(HWND, int);',
            '    using PFN_SetWindowLongPtrW          = LONG_PTR(WINAPI*)(HWND, int, LONG_PTR);',
            '    using PFN_SetLayeredWindowAttributes = BOOL(WINAPI*)(HWND, COLORREF, BYTE, DWORD);',
            '    using PFN_PeekMessageW               = BOOL(WINAPI*)(LPMSG, HWND, UINT, UINT, UINT);',
            '    using PFN_TranslateMessage           = BOOL(WINAPI*)(const MSG*);',
            '    using PFN_DispatchMessageW           = LRESULT(WINAPI*)(const MSG*);',
            '    using PFN_GetAsyncKeyState           = SHORT(WINAPI*)(int);',
            '',
            '    using PFN_RegCreateKeyExW            = LSTATUS(WINAPI*)(HKEY, LPCWSTR, DWORD, LPWSTR, DWORD, REGSAM, const LPSECURITY_ATTRIBUTES, PHKEY, LPDWORD);',
            '    using PFN_RegSetValueExW             = LSTATUS(WINAPI*)(HKEY, LPCWSTR, DWORD, DWORD, const BYTE*, DWORD);',
            '    using PFN_RegCloseKey                = LSTATUS(WINAPI*)(HKEY);',
            '',
            '    using PFN_wglGetCurrentContext       = HGLRC(WINAPI*)();',
            '    using PFN_wglGetCurrentDC            = HDC(WINAPI*)();',
            '    using PFN_wglGetProcAddress          = PROC(WINAPI*)(LPCSTR);',
            '    using PFN_wglSwapIntervalEXT         = BOOL(WINAPI*)(int);',
            '    using PFN_glDisable                  = void(APIENTRY*)(unsigned int);',
            '    using PFN_glHint                     = void(APIENTRY*)(unsigned int, unsigned int);',
            '    using PFN_glFlush                    = void(APIENTRY*)();',
            '',
            '    using PFN_CCAppShared                = void*(__cdecl*)();',
            '    using PFN_CCAppSetInterval           = void(__fastcall*)(void*, double);',
            '    using PFN_CCEGLShared                = void*(__cdecl*)();',
            '    using PFN_CCEGLToggleVSync           = void(__fastcall*)(void*, bool);',
            '',
            '    struct EarlyNvidiaFastSyncEnv {',
            '        EarlyNvidiaFastSyncEnv() {',
            '            SetEnvironmentVariableW(L"__GL_THREADED_OPTIMIZATIONS", L"0");',
            '            SetEnvironmentVariableW(L"__GL_SYNC_TO_VBLANK", L"0");',
            '            SetEnvironmentVariableW(L"__GL_MaxFramesAllowed", L"1");',
            '            SetEnvironmentVariableW(L"SHIM_MCCOMPAT", L"0x800000001");',
            '        }',
            '    };',
            '    static EarlyNvidiaFastSyncEnv s_earlyEnv;',
            '',
            '    template <typename T>',
            '    void configureGameManagerVars(T* gm, float targetFps) {',
            '        if (!gm) return;',
            '        gm->setGameVariable("0023", false); // Tắt Smooth Fix (Chống chậm màn chơi & đơ hình)',
            '        gm->setGameVariable("0030", false); // Tắt V-Sync cổ điển',
            '        gm->setGameVariable("0116", true);  // Bật Custom FPS Bypass',
            '        gm->setGameVariable("0155", false); // Giữ hình ảnh sắc nét nguyên bản',
            '        gm->setGameVariable("0136", true);  // Giảm lag âm thanh FMOD',
            '',
            '        if constexpr (requires { gm->m_customFPSTarget = 240.0f; }) {',
            '            gm->m_customFPSTarget = targetFps;',
            '        }',
            '    }',
            '}',
            '',
            'namespace HyperSuiteV20 {',
            '    static DWORD s_mainThreadId = 0;',
            '    static PFN_Sleep s_origSleep = ::Sleep;',
            '    static HANDLE s_mmcssHandle = nullptr;',
            '    static HANDLE s_ipcMapHandle = nullptr;',
            '    static SharedBoosterIPC* s_ipcView = nullptr;',
            '    static HGLRC s_lastGlContext = nullptr;',
            '    static HWND s_lastConfiguredHwnd = nullptr;',
            '',
            '    static PFN_timeEndPeriod s_timeEndPeriod = nullptr;',
            '    static PFN_AvRevertMmThreadChars s_avRevert = nullptr;',
            '    static PFN_DwmSetWindowAttribute s_dwmSetWindowAttribute = nullptr;',
            '    static PFN_DwmExtendFrameIntoClient s_dwmExtendFrame = nullptr;',
            '    static PFN_WindowFromDC s_windowFromDC = nullptr;',
            '    static PFN_GetWindowLongPtrW s_getWindowLongPtrW = nullptr;',
            '    static PFN_SetWindowLongPtrW s_setWindowLongPtrW = nullptr;',
            '    static PFN_SetLayeredWindowAttributes s_setLayeredAttrs = nullptr;',
            '    static PFN_PeekMessageW s_peekMessageW = nullptr;',
            '    static PFN_TranslateMessage s_translateMessage = nullptr;',
            '    static PFN_DispatchMessageW s_dispatchMessageW = nullptr;',
            '    static PFN_GetAsyncKeyState s_getAsyncKeyState = nullptr;',
            '',
            '    static PFN_wglGetCurrentContext s_wglGetCurrentContext = nullptr;',
            '    static PFN_wglGetCurrentDC s_wglGetCurrentDC = nullptr;',
            '    static PFN_wglGetProcAddress s_wglGetProcAddress = nullptr;',
            '    static PFN_wglSwapIntervalEXT s_wglSwapIntervalEXT = nullptr;',
            '    static PFN_glDisable s_glDisable = nullptr;',
            '    static PFN_glHint s_glHint = nullptr;',
            '    static PFN_glFlush s_glFlush = nullptr;',
            '',
            '    static PFN_CCAppShared s_ccAppShared = nullptr;',
            '    static PFN_CCAppSetInterval s_ccAppSetInterval = nullptr;',
            '    static PFN_CCEGLShared s_ccEglShared = nullptr;',
            '    static PFN_CCEGLToggleVSync s_ccEglToggleVSync = nullptr;',
            '',
            '    // Biến đồng bộ cho Luồng quét thao tác 2400Hz (10x Frame-Perfect Scanner)',
            '    static std::atomic<bool> s_scannerRunning{false};',
            '    static std::atomic<bool> s_subFrameInputPending{false};',
            '    static std::atomic<int>  s_subFrameSliceIndex{0};',
            '    static std::thread       s_scannerThread;',
            '',
            '    static double s_currentAppliedFps = 0.0;',
            '    static uint64_t s_frameCounter = 0;',
            '    static bool s_initialized = false;',
            '    static bool s_glLoaded = false;',
            '    static bool s_cocosLoaded = false;',
            '    static bool s_iatHooked = false;',
            '',
            '    // 1. Luồng quét phần cứng 2400Hz (0.41ms — Nhạy gấp 10 lần 240 FPS):',
            '    // Phát hiện tức thì thao tác nhấn/nhả Chuột trái, Space, Mũi tên lên hoặc phím W ở giữa 2 frame!',
            '    void run2400HzInputScanner() {',
            '        SetThreadPriority(GetCurrentThread(), THREAD_PRIORITY_HIGHEST);',
            '        bool lastHoldState = false;',
            '        int sliceCounter = 0;',
            '',
            '        LARGE_INTEGER freq = {};',
            '        QueryPerformanceFrequency(&freq);',
            '        const LONGLONG ticksPer2400Hz = freq.QuadPart / 2400; // ~0.416 ms',
            '',
            '        LARGE_INTEGER lastTick = {};',
            '        QueryPerformanceCounter(&lastTick);',
            '',
            '        while (s_scannerRunning.load(std::memory_order_relaxed)) {',
            '            if (s_getAsyncKeyState) {',
            '                bool lmb   = (s_getAsyncKeyState(VK_LBUTTON) & 0x8000) != 0;',
            '                bool space = (s_getAsyncKeyState(VK_SPACE)   & 0x8000) != 0;',
            '                bool up    = (s_getAsyncKeyState(VK_UP)      & 0x8000) != 0;',
            '                bool wKey  = (s_getAsyncKeyState(0x57)       & 0x8000) != 0;',
            '                bool currentHold = (lmb || space || up || wKey);',
            '',
            '                if (currentHold != lastHoldState) {',
            '                    lastHoldState = currentHold;',
            '                    s_subFrameSliceIndex.store(sliceCounter % 10, std::memory_order_relaxed);',
            '                    s_subFrameInputPending.store(true, std::memory_order_release);',
            '                    if (s_ipcView && s_ipcView->magic == 0x47443230) {',
            '                        ++s_ipcView->detectedClicks;',
            '                    }',
            '                }',
            '            }',
            '            ++sliceCounter;',
            '',
            '            // Nghỉ siêu ngắn ~0.41ms (2400Hz) nhưng tiêu tốn < 0.5% CPU nhờ SwitchToThread()',
            '            SwitchToThread();',
            '            LARGE_INTEGER now = {};',
            '            QueryPerformanceCounter(&now);',
            '            if ((now.QuadPart - lastTick.QuadPart) < ticksPer2400Hz) {',
            '                s_origSleep(1);',
            '            }',
            '            QueryPerformanceCounter(&lastTick);',
            '        }',
            '    }',
            '',
            '    // 2. Bẻ khóa IAT Sleep(1) thành Micro-Poll để giữ đúng 240 FPS không tụt xuống 210 FPS',
            '    void WINAPI HookedMicroPollSleep(DWORD dwMilliseconds) {',
            '        if (GetCurrentThreadId() == s_mainThreadId && dwMilliseconds <= 2) {',
            '            SwitchToThread();',
            '            for (int i = 0; i < 48; ++i) {',
            '                YieldProcessor();',
            '            }',
            '            return;',
            '        }',
            '        s_origSleep(dwMilliseconds);',
            '    }',
            '',
            '    void patchModuleSleepIAT(HMODULE hModule) {',
            '        if (!hModule) return;',
            '        auto* base = reinterpret_cast<std::uint8_t*>(hModule);',
            '        auto* dos = reinterpret_cast<PIMAGE_DOS_HEADER>(base);',
            '        if (dos->e_magic != IMAGE_DOS_SIGNATURE) return;',
            '',
            '        auto* nt = reinterpret_cast<PIMAGE_NT_HEADERS>(base + dos->e_lfanew);',
            '        if (nt->Signature != IMAGE_NT_SIGNATURE) return;',
            '',
            '        auto importDir = nt->OptionalHeader.DataDirectory[IMAGE_DIRECTORY_ENTRY_IMPORT];',
            '        if (!importDir.VirtualAddress || !importDir.Size) return;',
            '',
            '        auto* importDesc = reinterpret_cast<PIMAGE_IMPORT_DESCRIPTOR>(base + importDir.VirtualAddress);',
            '        for (; importDesc->Name; ++importDesc) {',
            '            auto* thunk = reinterpret_cast<PIMAGE_THUNK_DATA>(base + importDesc->FirstThunk);',
            '            for (; thunk->u1.Function; ++thunk) {',
            '                if (reinterpret_cast<void*>(thunk->u1.Function) == reinterpret_cast<void*>(s_origSleep)) {',
            '                    DWORD oldProtect = 0;',
            '                    if (VirtualProtect(&thunk->u1.Function, sizeof(ULONG_PTR), PAGE_READWRITE, &oldProtect)) {',
            '                        thunk->u1.Function = reinterpret_cast<ULONG_PTR>(&HookedMicroPollSleep);',
            '                        VirtualProtect(&thunk->u1.Function, sizeof(ULONG_PTR), oldProtect, &oldProtect);',
            '                    }',
            '                }',
            '            }',
            '        }',
            '    }',
            '',
            '    // 3. Cấu hình NVIDIA Fast Sync (0x18888888) + DXGI Layered Swapchain để xóa sọc nhiễu',
            '    void configureNvidiaFastSyncAndDXGI() {',
            '        HMODULE hNvapi = LoadLibraryW(L"nvapi64.dll");',
            '        if (!hNvapi) return;',
            '        auto queryInterface = reinterpret_cast<PFN_nvapi_QueryInterface>(GetProcAddress(hNvapi, "nvapi_QueryInterface"));',
            '        if (!queryInterface) return;',
            '',
            '        auto nvInit        = reinterpret_cast<PFN_NvAPI_Initialize>(queryInterface(0x0150E828));',
            '        auto drsCreateSess = reinterpret_cast<PFN_NvAPI_DRS_CreateSess>(queryInterface(0x0694D52E));',
            '        auto drsDestroySess= reinterpret_cast<PFN_NvAPI_DRS_DestroySess>(queryInterface(0xDAD9CFF8));',
            '        auto drsLoad       = reinterpret_cast<PFN_NvAPI_DRS_LoadSettings>(queryInterface(0x375DBD6B));',
            '        auto drsSave       = reinterpret_cast<PFN_NvAPI_DRS_SaveSettings>(queryInterface(0xFCBC7E14));',
            '        auto drsGetBase    = reinterpret_cast<PFN_NvAPI_DRS_GetBaseProf>(queryInterface(0xDA8466A0));',
            '        auto drsSetSetting = reinterpret_cast<PFN_NvAPI_DRS_SetSetting>(queryInterface(0x577DD202));',
            '',
            '        if (!nvInit || !drsCreateSess || !drsDestroySess || !drsLoad || !drsSave || !drsGetBase || !drsSetSetting) return;',
            '        if (nvInit() != 0) return;',
            '',
            '        void* hSession = nullptr;',
            '        if (drsCreateSess(&hSession) != 0 || !hSession) return;',
            '',
            '        if (drsLoad(hSession) == 0) {',
            '            void* hProfile = nullptr;',
            '            if (drsGetBase(hSession, &hProfile) == 0 && hProfile) {',
            '                auto setDword = [&](std::uint32_t id, std::uint32_t val) {',
            '                    NVDRS_SETTING_V1 s = {};',
            '                    s.version = static_cast<std::uint32_t>(sizeof(NVDRS_SETTING_V1) | (1U << 16));',
            '                    s.settingId = id;',
            '                    s.settingType = 0;',
            '                    s.u32CurrentValue = val;',
            '                    drsSetSetting(hSession, hProfile, &s);',
            '                };',
            '                setDword(0x1057EB71, 0x00000001); // Prefer Maximum Performance',
            '                setDword(0x007BA09E, 0x00000001); // Max Pre-Rendered Frames = 1',
            '                setDword(0x20FF7493, 0x00000000); // OpenGL Triple Buffering = OFF',
            '                setDword(0x20D9718C, 0x00002002); // Prefer Layered on DXGI Swapchain',
            '                setDword(0x00A879CF, 0x18888888); // V-Sync = NVIDIA FAST SYNC (0x18888888 - Xóa sọc nhiễu ở 240 FPS!)',
            '                setDword(0x00E73211, 0xFFFFFFF6); // Texture Filtering = High Performance',
            '                setDword(0x20C1221E, 0x00000002); // Threaded Optimization = Off',
            '                setDword(0x10F9DC81, 0x00000001); // Optimus High-Performance GPU = MX350',
            '                drsSave(hSession);',
            '            }',
            '        }',
            '        drsDestroySess(hSession);',
            '    }',
            '',
            '    // 4. Đặt SwapEffectUpgradeEnable=0 trong Registry để ngăn Independent Flip gây sọc ngang trên laptop Optimus!',
            '    void configureWin11AntiTearRegistry() {',
            '        HMODULE hAdvapi = LoadLibraryW(L"advapi32.dll");',
            '        if (!hAdvapi) return;',
            '        auto regCreate = reinterpret_cast<PFN_RegCreateKeyExW>(GetProcAddress(hAdvapi, "RegCreateKeyExW"));',
            '        auto regSet    = reinterpret_cast<PFN_RegSetValueExW>(GetProcAddress(hAdvapi, "RegSetValueExW"));',
            '        auto regClose  = reinterpret_cast<PFN_RegCloseKey>(GetProcAddress(hAdvapi, "RegCloseKey"));',
            '        if (!regCreate || !regSet || !regClose) return;',
            '',
            '        wchar_t exePath[MAX_PATH] = {};',
            '        if (!GetModuleFileNameW(nullptr, exePath, MAX_PATH)) return;',
            '',
            '        HKEY hKeyGpu = nullptr;',
            '        if (regCreate(HKEY_CURRENT_USER, L"Software\\Microsoft\\DirectX\\UserGpuPreferences",',
            '                      0, nullptr, 0, KEY_SET_VALUE, nullptr, &hKeyGpu, nullptr) == 0) {',
            '            const wchar_t* gpuVal = L"GpuPreference=2;SwapEffectUpgradeEnable=0;";',
            '            DWORD byteLen = static_cast<DWORD>((wcslen(gpuVal) + 1) * sizeof(wchar_t));',
            '            regSet(hKeyGpu, exePath, 0, REG_SZ, reinterpret_cast<const BYTE*>(gpuVal), byteLen);',
            '            regClose(hKeyGpu);',
            '        }',
            '    }',
            '',
            '    // 5. Ép cửa sổ Geometry Dash đi qua bộ đệm DWM Mailbox Compositor (0% sọc nhiễu trên màn 60Hz)',
            '    void enforceDwmMailboxAntiTearOnWindow(HWND hwnd) {',
            '        if (!hwnd) return;',
            '        bool enableMailbox = true;',
            '        if (s_ipcView && s_ipcView->magic == 0x47443230) {',
            '            enableMailbox = (s_ipcView->antiTearMode != 0);',
            '        }',
            '',
            '        if (s_getWindowLongPtrW && s_setWindowLongPtrW && s_setLayeredAttrs) {',
            '            LONG_PTR exStyle = s_getWindowLongPtrW(hwnd, GWL_EXSTYLE);',
            '            if (enableMailbox) {',
            '                // Thêm cờ WS_EX_LAYERED với độ đục 255 (100% rõ nét):',
            '                // Buộc Windows 11 DWM tắt Independent Flip gây rách hình và dùng DWM Mailbox V-Blank!',
            '                if ((exStyle & WS_EX_LAYERED) == 0) {',
            '                    s_setWindowLongPtrW(hwnd, GWL_EXSTYLE, exStyle | WS_EX_LAYERED);',
            '                }',
            '                s_setLayeredAttrs(hwnd, 0, 255, LWA_ALPHA);',
            '            } else {',
            '                if ((exStyle & WS_EX_LAYERED) != 0) {',
            '                    s_setWindowLongPtrW(hwnd, GWL_EXSTYLE, exStyle & ~static_cast<LONG_PTR>(WS_EX_LAYERED));',
            '                }',
            '            }',
            '        }',
            '',
            '        if (s_dwmExtendFrame && enableMailbox) {',
            '            DWM_MARGINS margins = { 0, 0, 0, 1 };',
            '            s_dwmExtendFrame(hwnd, &margins);',
            '        }',
            '',
            '        if (s_dwmSetWindowAttribute) {',
            '            DWORD ncPolicy = 2; // DWMNCRP_ENABLED',
            '            s_dwmSetWindowAttribute(hwnd, 2, &ncPolicy, sizeof(ncPolicy));',
            '        }',
            '    }',
            '',
            '    void initSharedMemoryIPC() {',
            '        if (s_ipcMapHandle) return;',
            '        s_ipcMapHandle = CreateFileMappingW(',
            '            INVALID_HANDLE_VALUE, nullptr, PAGE_READWRITE, 0, sizeof(SharedBoosterIPC), L"Local\\GD_HyperBoost_IPC_v20"',
            '        );',
            '        if (s_ipcMapHandle) {',
            '            s_ipcView = reinterpret_cast<SharedBoosterIPC*>(',
            '                MapViewOfFile(s_ipcMapHandle, FILE_MAP_ALL_ACCESS, 0, 0, sizeof(SharedBoosterIPC))',
            '            );',
            '            if (s_ipcView && s_ipcView->magic != 0x47443230) {',
            '                s_ipcView->magic          = 0x47443230;',
            '                s_ipcView->targetFps      = static_cast<float>(DEFAULT_240_FPS);',
            '                s_ipcView->subFrameMult   = 4; // Mặc định chia 4 bước (960Hz TPS) khi nhấn chuột',
            '                s_ipcView->antiTearMode   = 1; // Mặc định Bật chống sọc nhiễu DWM Mailbox',
            '                s_ipcView->forceFlush     = 0;',
            '                s_ipcView->detectedClicks = 0;',
            '            }',
            '        }',
            '    }',
            '',
            '    void initAllSystems() {',
            '        if (s_initialized) return;',
            '',
            '        initSharedMemoryIPC();',
            '        configureWin11AntiTearRegistry();',
            '        configureNvidiaFastSyncAndDXGI();',
            '',
            '        if (!s_iatHooked) {',
            '            s_mainThreadId = GetCurrentThreadId();',
            '            patchModuleSleepIAT(GetModuleHandleW(L"libcocos2d.dll"));',
            '            patchModuleSleepIAT(GetModuleHandleW(nullptr));',
            '            s_iatHooked = true;',
            '        }',
            '',
            '        if (HMODULE hNtdll = GetModuleHandleW(L"ntdll.dll")) {',
            '            auto ntQuery = reinterpret_cast<PFN_NtQueryTimerResolution>(GetProcAddress(hNtdll, "NtQueryTimerResolution"));',
            '            auto ntSet   = reinterpret_cast<PFN_NtSetTimerResolution>(GetProcAddress(hNtdll, "NtSetTimerResolution"));',
            '            if (ntSet) {',
            '                ULONG minRes = 0, maxRes = 5000, curRes = 0;',
            '                if (ntQuery) ntQuery(&minRes, &maxRes, &curRes);',
            '                ntSet(maxRes, TRUE, &curRes);',
            '            }',
            '        }',
            '',
            '        if (HMODULE hWinmm = LoadLibraryW(L"winmm.dll")) {',
            '            auto timeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"));',
            '            s_timeEndPeriod = reinterpret_cast<PFN_timeEndPeriod>(GetProcAddress(hWinmm, "timeEndPeriod"));',
            '            if (timeBegin) timeBegin(1);',
            '        }',
            '',
            '        if (HMODULE hUser32 = GetModuleHandleW(L"user32.dll")) {',
            '            s_windowFromDC       = reinterpret_cast<PFN_WindowFromDC>(GetProcAddress(hUser32, "WindowFromDC"));',
            '            s_getWindowLongPtrW  = reinterpret_cast<PFN_GetWindowLongPtrW>(GetProcAddress(hUser32, "GetWindowLongPtrW"));',
            '            s_setWindowLongPtrW  = reinterpret_cast<PFN_SetWindowLongPtrW>(GetProcAddress(hUser32, "SetWindowLongPtrW"));',
            '            s_setLayeredAttrs    = reinterpret_cast<PFN_SetLayeredWindowAttributes>(GetProcAddress(hUser32, "SetLayeredWindowAttributes"));',
            '            s_peekMessageW       = reinterpret_cast<PFN_PeekMessageW>(GetProcAddress(hUser32, "PeekMessageW"));',
            '            s_translateMessage   = reinterpret_cast<PFN_TranslateMessage>(GetProcAddress(hUser32, "TranslateMessage"));',
            '            s_dispatchMessageW   = reinterpret_cast<PFN_DispatchMessageW>(GetProcAddress(hUser32, "DispatchMessageW"));',
            '            s_getAsyncKeyState   = reinterpret_cast<PFN_GetAsyncKeyState>(GetProcAddress(hUser32, "GetAsyncKeyState"));',
            '        }',
            '        if (HMODULE hDwm = LoadLibraryW(L"dwmapi.dll")) {',
            '            s_dwmSetWindowAttribute = reinterpret_cast<PFN_DwmSetWindowAttribute>(GetProcAddress(hDwm, "DwmSetWindowAttribute"));',
            '            s_dwmExtendFrame        = reinterpret_cast<PFN_DwmExtendFrameIntoClient>(GetProcAddress(hDwm, "DwmExtendFrameIntoClientArea"));',
            '        }',
            '',
            '        HANDLE hProcess = GetCurrentProcess();',
            '        HANDLE hThread = GetCurrentThread();',
            '        SetPriorityClass(hProcess, ABOVE_NORMAL_PRIORITY_CLASS);',
            '        SetThreadPriority(hThread, THREAD_PRIORITY_ABOVE_NORMAL);',
            '        SetProcessPriorityBoost(hProcess, FALSE);',
            '        SetThreadPriorityBoost(hThread, FALSE);',
            '',
            '        if (HMODULE hKernel32 = GetModuleHandleW(L"kernel32.dll")) {',
            '            auto setProcInfo = reinterpret_cast<PFN_SetProcessInformation>(GetProcAddress(hKernel32, "SetProcessInformation"));',
            '            if (setProcInfo) {',
            '                Win11PowerThrottling throttling = { 1, 0x1 | 0x4, 0 };',
            '                setProcInfo(hProcess, 4, &throttling, sizeof(throttling));',
            '            }',
            '        }',
            '',
            '        if (HMODULE hAvrt = LoadLibraryW(L"avrt.dll")) {',
            '            auto avSetChars = reinterpret_cast<PFN_AvSetMmThreadCharsW>(GetProcAddress(hAvrt, "AvSetMmThreadCharacteristicsW"));',
            '            auto avSetPrio  = reinterpret_cast<PFN_AvSetMmThreadPriority>(GetProcAddress(hAvrt, "AvSetMmThreadPriority"));',
            '            s_avRevert      = reinterpret_cast<PFN_AvRevertMmThreadChars>(GetProcAddress(hAvrt, "AvRevertMmThreadCharacteristics"));',
            '            if (avSetChars) {',
            '                DWORD taskIdx = 0;',
            '                s_mmcssHandle = avSetChars(L"Games", &taskIdx);',
            '                if (s_mmcssHandle && avSetPrio) avSetPrio(s_mmcssHandle, 1);',
            '            }',
            '        }',
            '',
            '        if (!s_scannerRunning.load()) {',
            '            s_scannerRunning.store(true);',
            '            s_scannerThread = std::thread(run2400HzInputScanner);',
            '        }',
            '',
            '        s_initialized = true;',
            '    }',
            '',
            '    struct LifecycleGuard {',
            '        ~LifecycleGuard() {',
            '            if (s_scannerRunning.load()) {',
            '                s_scannerRunning.store(false);',
            '                if (s_scannerThread.joinable()) {',
            '                    s_scannerThread.join();',
            '                }',
            '            }',
            '            if (s_ipcView) { UnmapViewOfFile(s_ipcView); s_ipcView = nullptr; }',
            '            if (s_ipcMapHandle) { CloseHandle(s_ipcMapHandle); s_ipcMapHandle = nullptr; }',
            '            if (!s_initialized) return;',
            '            if (s_mmcssHandle && s_avRevert) { s_avRevert(s_mmcssHandle); s_mmcssHandle = nullptr; }',
            '            if (s_timeEndPeriod) s_timeEndPeriod(1);',
            '            s_initialized = false;',
            '        }',
            '    };',
            '    static LifecycleGuard s_guard;',
            '',
            '    void pumpPendingInputMessages() {',
            '        if (s_peekMessageW && s_translateMessage && s_dispatchMessageW) {',
            '            MSG msg;',
            '            while (s_peekMessageW(&msg, nullptr, WM_MOUSEFIRST, WM_MOUSELAST, PM_REMOVE | PM_NOYIELD)) {',
            '                s_translateMessage(&msg);',
            '                s_dispatchMessageW(&msg);',
            '            }',
            '            while (s_peekMessageW(&msg, nullptr, WM_KEYFIRST, WM_KEYLAST, PM_REMOVE | PM_NOYIELD)) {',
            '                s_translateMessage(&msg);',
            '                s_dispatchMessageW(&msg);',
            '            }',
            '        }',
            '    }',
            '',
            '    void syncTargetFrameRate(bool forceApply = false) {',
            '        if (!s_cocosLoaded) {',
            '            if (HMODULE hCocos = GetModuleHandleW(L"libcocos2d.dll")) {',
            '                s_ccAppShared = reinterpret_cast<PFN_CCAppShared>(GetProcAddress(hCocos, "?sharedApplication@CCApplication@cocos2d@@SAPEAV12@XZ"));',
            '                s_ccAppSetInterval = reinterpret_cast<PFN_CCAppSetInterval>(GetProcAddress(hCocos, "?setAnimationInterval@CCApplication@cocos2d@@UEAAXN@Z"));',
            '                s_ccEglShared = reinterpret_cast<PFN_CCEGLShared>(GetProcAddress(hCocos, "?sharedOpenGLView@CCEGLView@cocos2d@@SAPEAV12@XZ"));',
            '                s_ccEglToggleVSync = reinterpret_cast<PFN_CCEGLToggleVSync>(GetProcAddress(hCocos, "?toggleVerticalSync@CCEGLView@cocos2d@@QEAAX_N@Z"));',
            '            }',
            '            s_cocosLoaded = true;',
            '        }',
            '',
            '        double desiredFps = DEFAULT_240_FPS;',
            '        if (s_ipcView && s_ipcView->magic == 0x47443230 && s_ipcView->targetFps >= 60.0f) {',
            '            desiredFps = static_cast<double>(s_ipcView->targetFps);',
            '            if (s_ipcView->forceFlush != 0) {',
            '                s_ipcView->forceFlush = 0;',
            '                forceApply = true;',
            '                if (s_lastConfiguredHwnd) {',
            '                    enforceDwmMailboxAntiTearOnWindow(s_lastConfiguredHwnd);',
            '                }',
            '            }',
            '        }',
            '',
            '        if (forceApply || std::fabs(desiredFps - s_currentAppliedFps) > 0.1) {',
            '            s_currentAppliedFps = desiredFps;',
            '            configureGameManagerVars(GameManager::sharedState(), static_cast<float>(desiredFps));',
            '            if (s_ccAppShared && s_ccAppSetInterval) {',
            '                if (void* app = s_ccAppShared()) {',
            '                    // Bù 1% chu kỳ vòng lặp để bộ đếm ghim đúng 240.0 FPS không tụt xuống 210',
            '                    s_ccAppSetInterval(app, 1.0 / (desiredFps + 2.5));',
            '                }',
            '            }',
            '        }',
            '    }',
            '',
            '    void onSwapBuffersOncePerContext() {',
            '        if (!s_initialized) initAllSystems();',
            '        ++s_frameCounter;',
            '',
            '        if (!s_glLoaded) {',
            '            HMODULE hOgl = GetModuleHandleW(L"opengl32.dll");',
            '            if (!hOgl) hOgl = LoadLibraryW(L"opengl32.dll");',
            '            if (hOgl) {',
            '                s_wglGetCurrentContext = reinterpret_cast<PFN_wglGetCurrentContext>(GetProcAddress(hOgl, "wglGetCurrentContext"));',
            '                s_wglGetCurrentDC      = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hOgl, "wglGetCurrentDC"));',
            '                s_wglGetProcAddress    = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hOgl, "wglGetProcAddress"));',
            '                s_glDisable            = reinterpret_cast<PFN_glDisable>(GetProcAddress(hOgl, "glDisable"));',
            '                s_glHint               = reinterpret_cast<PFN_glHint>(GetProcAddress(hOgl, "glHint"));',
            '                s_glFlush              = reinterpret_cast<PFN_glFlush>(GetProcAddress(hOgl, "glFlush"));',
            '            }',
            '            s_glLoaded = true;',
            '        }',
            '',
            '        HGLRC currentCtx = s_wglGetCurrentContext ? s_wglGetCurrentContext() : nullptr;',
            '        if (currentCtx != s_lastGlContext) {',
            '            s_lastGlContext = currentCtx;',
            '            if (s_wglGetProcAddress) {',
            '                s_wglSwapIntervalEXT = reinterpret_cast<PFN_wglSwapIntervalEXT>(s_wglGetProcAddress("wglSwapIntervalEXT"));',
            '            }',
            '            if (s_wglSwapIntervalEXT) s_wglSwapIntervalEXT(0);',
            '            if (s_ccEglShared && s_ccEglToggleVSync) {',
            '                if (void* view = s_ccEglShared()) s_ccEglToggleVSync(view, false);',
            '            }',
            '',
            '            if (s_wglGetCurrentDC && s_windowFromDC) {',
            '                if (HDC hdc = s_wglGetCurrentDC()) {',
            '                    if (HWND hwnd = s_windowFromDC(hdc)) {',
            '                        s_lastConfiguredHwnd = hwnd;',
            '                        enforceDwmMailboxAntiTearOnWindow(hwnd);',
            '                    }',
            '                }',
            '            }',
            '',
            '            if (s_glDisable) {',
            '                s_glDisable(GL_SAMPLE_ALPHA_TO_COVERAGE_CAP);',
            '                s_glDisable(GL_MULTISAMPLE_CAP);',
            '                s_glDisable(GL_POLYGON_SMOOTH_CAP);',
            '                s_glDisable(GL_LINE_SMOOTH_CAP);',
            '                s_glDisable(GL_DITHER_CAP);',
            '            }',
            '            if (s_glHint) {',
            '                s_glHint(GL_PERSPECTIVE_CORRECTION_CAP, GL_FASTEST_MODE);',
            '            }',
            '            syncTargetFrameRate(true);',
            '        } else if ((s_frameCounter & 127) == 0) {',
            '            syncTargetFrameRate(false);',
            '        }',
            '    }',
            '}',
            '',
            '// 1. Hook GameManager: Khởi tạo cấu hình chuẩn 240 FPS',
            'class $modify(HyperGameManager20, GameManager) {',
            '    bool init() {',
            '        if (!GameManager::init()) return false;',
            '        HyperSuiteV20::initAllSystems();',
            '        HyperSuiteV20::syncTargetFrameRate(true);',
            '        return true;',
            '    }',
            '};',
            '',
            '// 2. Hook GJBaseGameLayer: Bộ chia bước vật lý On-Click 2400Hz (Dễ làm Frame-Perfect gấp 10 lần!)',
            '//    Tổng thời gian các bước con luôn bằng ĐÚNG 100% dt -> Không bao giờ làm chậm màn chơi hay delay nhạc!',
            'class $modify(HyperFramePerfectLayer20, GJBaseGameLayer) {',
            '    bool init() {',
            '        if (!GJBaseGameLayer::init()) return false;',
            '        HyperSuiteV20::initAllSystems();',
            '        HyperSuiteV20::syncTargetFrameRate(true);',
            '        return true;',
            '    }',
            '',
            '    void update(float dt) {',
            '        // Nếu luồng 2400Hz phát hiện người chơi vừa nhấn hoặc nhả chuột/phím ngay trong khung hình này:',
            '        if (HyperSuiteV20::s_subFrameInputPending.exchange(false, std::memory_order_acquire) &&',
            '            dt > 0.0005f && dt < 0.025f) {',
            '            int mult = 4;',
            '            if (HyperSuiteV20::s_ipcView && HyperSuiteV20::s_ipcView->magic == 0x47443230) {',
            '                mult = static_cast<int>(HyperSuiteV20::s_ipcView->subFrameMult);',
            '                if (mult < 2) mult = 2;',
            '                if (mult > 10) mult = 10;',
            '            }',
            '',
            '            float sliceDt = dt / static_cast<float>(mult);',
            '            for (int i = 0; i < mult; ++i) {',
            '                HyperSuiteV20::pumpPendingInputMessages();',
            '                GJBaseGameLayer::update(sliceDt);',
            '            }',
            '            return;',
            '        }',
            '',
            '        // Các khung hình không có sự kiện đổi trạng thái nút bấm chạy 1 bước nguyên bản -> 0% lag!',
            '        GJBaseGameLayer::update(dt);',
            '    }',
            '};',
            '',
            '// 3. Hook CCEGLView: Xóa sọc nhiễu qua DWM Mailbox Compositor & Giảm trễ Click tối đa',
            'class $modify(HyperAntiTearEGLView20, CCEGLView) {',
            '    void swapBuffers() {',
            '        HyperSuiteV20::onSwapBuffersOncePerContext();',
            '        CCEGLView::swapBuffers();',
            '        if (HyperSuiteV20::s_glFlush) {',
            '            HyperSuiteV20::s_glFlush();',
            '        }',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    HyperSuiteV20::initAllSystems();',
            '    Loader::get()->queueInMainThread([]() {',
            '        HyperSuiteV20::syncTargetFrameRate(true);',
            '    });',
            '}'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$PWD/src/main.cpp", $cppLines, (New-Object System.Text.UTF8Encoding($false)))

      - name: Build Geode Mod (Primary)
        id: build
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          use-lto: false

      - name: Self-Healing Build & Package Both Mod + External 10x Tool
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Ensure-LogoInGeodePackage([string]$geodePath) {
            if ((Test-Path $geodePath) -and (Test-Path "$PWD/logo.png")) {
              $zip = [System.IO.Compression.ZipFile]::Open($geodePath, [System.IO.Compression.ZipArchiveMode]::Update)
              $existing = $zip.GetEntry("logo.png")
              if (-not $existing) {
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, "$PWD/logo.png", "logo.png") | Out-Null
                Write-Host "Injected logo.png into $geodePath"
              }
              $zip.Dispose()
            }
          }

          New-Item -ItemType Directory -Path "artifact_out" -Force | Out-Null

          # 1. Biên dịch Tool chạy bên ngoài v20.0 (GD-External-FPS-Booster.exe)
          $extSrcDir = Join-Path $env:RUNNER_TEMP "gd_ext_tool_v20_src"
          $extBldDir = Join-Path $env:RUNNER_TEMP "gd_ext_tool_v20_bld"
          New-Item -ItemType Directory -Path $extSrcDir -Force | Out-Null

          $extCpp = @(
            '#ifndef WIN32_LEAN_AND_MEAN',
            '#define WIN32_LEAN_AND_MEAN',
            '#endif',
            '#include <windows.h>',
            '#include <tlhelp32.h>',
            '#include <psapi.h>',
            '#include <dwmapi.h>',
            '#include <cstdio>',
            '#include <cstdint>',
            '',
            '#pragma comment(lib, "user32.lib")',
            '#pragma comment(lib, "gdi32.lib")',
            '#pragma comment(lib, "advapi32.lib")',
            '#pragma comment(lib, "psapi.lib")',
            '#pragma comment(lib, "dwmapi.lib")',
            '',
            'struct SharedBoosterIPC {',
            '    std::uint32_t magic;',
            '    float         targetFps;',
            '    std::uint32_t subFrameMult;',
            '    std::uint32_t antiTearMode;',
            '    std::uint32_t forceFlush;',
            '    std::uint32_t detectedClicks;',
            '};',
            '',
            'struct Win11PowerThrottling {',
            '    ULONG Version;',
            '    ULONG ControlMask;',
            '    ULONG StateMask;',
            '};',
            '',
            'using PFN_NtQueryTimerResolution = LONG(NTAPI*)(PULONG, PULONG, PULONG);',
            'using PFN_NtSetTimerResolution   = LONG(NTAPI*)(ULONG, BOOLEAN, PULONG);',
            'using PFN_timeBeginPeriod        = UINT(WINAPI*)(UINT);',
            'using PFN_SetProcessInformation  = BOOL(WINAPI*)(HANDLE, int, LPVOID, DWORD);',
            '',
            'DWORD FindGeometryDashPID() {',
            '    DWORD pid = 0;',
            '    HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);',
            '    if (snap != INVALID_HANDLE_VALUE) {',
            '        PROCESSENTRY32W pe = {};',
            '        pe.dwSize = sizeof(pe);',
            '        if (Process32FirstW(snap, &pe)) {',
            '            do {',
            '                if (_wcsicmp(pe.szExeFile, L"GeometryDash.exe") == 0) {',
            '                    pid = pe.th32ProcessID;',
            '                    break;',
            '                }',
            '            } while (Process32NextW(snap, &pe));',
            '        }',
            '        CloseHandle(snap);',
            '    }',
            '    return pid;',
            '}',
            '',
            'struct EnumHwndData {',
            '    DWORD targetPid;',
            '    HWND  foundHwnd;',
            '};',
            '',
            'BOOL CALLBACK EnumWindowsCallback(HWND hwnd, LPARAM lParam) {',
            '    auto* data = reinterpret_cast<EnumHwndData*>(lParam);',
            '    DWORD winPid = 0;',
            '    GetWindowThreadProcessId(hwnd, &winPid);',
            '    if (winPid == data->targetPid && IsWindowVisible(hwnd)) {',
            '        data->foundHwnd = hwnd;',
            '        return FALSE;',
            '    }',
            '    return TRUE;',
            '}',
            '',
            'void EnforceExternalDwmAntiTear(DWORD pid, bool enableMailbox) {',
            '    if (!pid) return;',
            '    EnumHwndData data = { pid, nullptr };',
            '    EnumWindows(EnumWindowsCallback, reinterpret_cast<LPARAM>(&data));',
            '    if (!data.foundHwnd) return;',
            '',
            '    LONG_PTR exStyle = GetWindowLongPtrW(data.foundHwnd, GWL_EXSTYLE);',
            '    if (enableMailbox) {',
            '        SetWindowLongPtrW(data.foundHwnd, GWL_EXSTYLE, exStyle | WS_EX_LAYERED);',
            '        SetLayeredWindowAttributes(data.foundHwnd, 0, 255, LWA_ALPHA);',
            '        MARGINS margins = { 0, 0, 0, 1 };',
            '        DwmExtendFrameIntoClientArea(data.foundHwnd, &margins);',
            '    } else {',
            '        SetWindowLongPtrW(data.foundHwnd, GWL_EXSTYLE, exStyle & ~static_cast<LONG_PTR>(WS_EX_LAYERED));',
            '    }',
            '}',
            '',
            'void BoostGeometryDashAndWindows(DWORD pid, bool trimRam) {',
            '    if (trimRam) {',
            '        HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);',
            '        if (snap != INVALID_HANDLE_VALUE) {',
            '            PROCESSENTRY32W pe = {};',
            '            pe.dwSize = sizeof(pe);',
            '            if (Process32FirstW(snap, &pe)) {',
            '                do {',
            '                    if (pe.th32ProcessID != pid && pe.th32ProcessID > 4) {',
            '                        HANDLE hOther = OpenProcess(PROCESS_SET_QUOTA | PROCESS_QUERY_INFORMATION, FALSE, pe.th32ProcessID);',
            '                        if (hOther) {',
            '                            EmptyWorkingSet(hOther);',
            '                            CloseHandle(hOther);',
            '                        }',
            '                    }',
            '                } while (Process32NextW(snap, &pe));',
            '            }',
            '            CloseHandle(snap);',
            '        }',
            '    }',
            '    if (!pid) return;',
            '    HANDLE hProc = OpenProcess(PROCESS_ALL_ACCESS, FALSE, pid);',
            '    if (!hProc) return;',
            '    SetPriorityClass(hProc, ABOVE_NORMAL_PRIORITY_CLASS);',
            '    SetProcessPriorityBoost(hProc, FALSE);',
            '    if (HMODULE hKernel32 = GetModuleHandleW(L"kernel32.dll")) {',
            '        auto setProcInfo = reinterpret_cast<PFN_SetProcessInformation>(GetProcAddress(hKernel32, "SetProcessInformation"));',
            '        if (setProcInfo) {',
            '            Win11PowerThrottling throttling = { 1, 0x1 | 0x4, 0 };',
            '            setProcInfo(hProc, 4, &throttling, sizeof(throttling));',
            '        }',
            '    }',
            '    CloseHandle(hProc);',
            '}',
            '',
            '// Tạo cửa sổ neo DWM 1x1 pixel trong suốt hoàn toàn để khóa chế độ DWM Mailbox Compositor trên màn 60Hz',
            'HWND CreateInvisibleDwmMailboxAnchor() {',
            '    WNDCLASSEXW wc = {};',
            '    wc.cbSize        = sizeof(wc);',
            '    wc.lpfnWndProc   = DefWindowProcW;',
            '    wc.hInstance     = GetModuleHandleW(nullptr);',
            '    wc.lpszClassName = L"GD_DWM_Mailbox_Anchor_v20";',
            '    RegisterClassExW(&wc);',
            '',
            '    HWND hwnd = CreateWindowExW(',
            '        WS_EX_LAYERED | WS_EX_TRANSPARENT | WS_EX_TOPMOST | WS_EX_TOOLWINDOW | WS_EX_NOACTIVATE,',
            '        wc.lpszClassName, L"", WS_POPUP, 0, 0, 1, 1, nullptr, nullptr, wc.hInstance, nullptr',
            '    );',
            '    if (hwnd) {',
            '        SetLayeredWindowAttributes(hwnd, 0, 1, LWA_ALPHA);',
            '        ShowWindow(hwnd, SW_SHOWNOACTIVATE);',
            '    }',
            '    return hwnd;',
            '}',
            '',
            'int main() {',
            '    SetConsoleTitleW(L"GD 2.2081 - 10x Frame-Perfect Bypass & Anti-Tear Suite v20.0");',
            '',
            '    if (HMODULE hNtdll = GetModuleHandleW(L"ntdll.dll")) {',
            '        auto ntQuery = reinterpret_cast<PFN_NtQueryTimerResolution>(GetProcAddress(hNtdll, "NtQueryTimerResolution"));',
            '        auto ntSet   = reinterpret_cast<PFN_NtSetTimerResolution>(GetProcAddress(hNtdll, "NtSetTimerResolution"));',
            '        if (ntSet) {',
            '            ULONG minRes = 0, maxRes = 5000, curRes = 0;',
            '            if (ntQuery) ntQuery(&minRes, &maxRes, &curRes);',
            '            ntSet(maxRes, TRUE, &curRes);',
            '        }',
            '    }',
            '    if (HMODULE hWinmm = LoadLibraryW(L"winmm.dll")) {',
            '        auto timeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"));',
            '        if (timeBegin) timeBegin(1);',
            '    }',
            '',
            '    HWND hAnchor = CreateInvisibleDwmMailboxAnchor();',
            '',
            '    HANDLE hMap = CreateFileMappingW(',
            '        INVALID_HANDLE_VALUE, nullptr, PAGE_READWRITE, 0, sizeof(SharedBoosterIPC), L"Local\\GD_HyperBoost_IPC_v20"',
            '    );',
            '    SharedBoosterIPC* ipc = nullptr;',
            '    if (hMap) {',
            '        ipc = reinterpret_cast<SharedBoosterIPC*>(MapViewOfFile(hMap, FILE_MAP_ALL_ACCESS, 0, 0, sizeof(SharedBoosterIPC)));',
            '        if (ipc) {',
            '            ipc->magic          = 0x47443230;',
            '            ipc->targetFps      = 240.0f;',
            '            ipc->subFrameMult   = 10; // Kích hoạt ngay chế độ 10x Frame-Perfect (2400Hz)',
            '            ipc->antiTearMode   = 1;  // Kích hoạt ngay DWM Mailbox chống sọc nhiễu',
            '            ipc->forceFlush     = 1;',
            '            ipc->detectedClicks = 0;',
            '        }',
            '    }',
            '',
            '    std::printf("======================================================================\n");',
            '    std::printf("   GEOMETRY DASH 2.2081 - 10X FRAME-PERFECT & ANTI-TEAR SUITE v20.0   \n");',
            '    std::printf("   Hardware Target: Windows 11 | 8GB RAM | NVIDIA GeForce MX350       \n");',
            '    std::printf("======================================================================\n\n");',
            '    std::printf(" [+] Kernel 0.50ms Timer         : LOCKED\n");',
            '    std::printf(" [+] DWM Mailbox Anti-Tear (60Hz): ACTIVE (Xoa 100%% soc nhieu ngang)\n");',
            '    std::printf(" [+] 2400Hz Sub-Frame Click Scan : ACTIVE (10x Frame-Perfect Assist)\n\n");',
            '    std::printf(" PHIM NONG DIEU KHIEN TRUC TIEP KHI DANG CHOI GAME:\n");',
            '    std::printf("   [F1] -> Khoa cung 240 FPS + 10x Frame-Perfect (Chuan muot cho MX350)\n");',
            '    std::printf("   [F2] -> Bypass len 360 FPS + 10x Frame-Perfect\n");',
            '    std::printf("   [F3] -> Bypass len 480 FPS + 10x Frame-Perfect\n");',
            '    std::printf("   [F4] -> Doi cap do Sub-Frame Assist (4x [960Hz] / 8x [1920Hz] / 10x [2400Hz])\n");',
            '    std::printf("   [F5] -> Bat/Tat DWM Mailbox Anti-Tear (Khu soc nhieu man hinh 60Hz)\n");',
            '    std::printf("   [F6] -> Don sach RAM ngam cho may 8GB (Chong do & lag tuc thi)\n\n");',
            '',
            '    DWORD lastPid = 0;',
            '    int tick = 0;',
            '    while (true) {',
            '        MSG msg;',
            '        while (PeekMessageW(&msg, nullptr, 0, 0, PM_REMOVE)) {',
            '            TranslateMessage(&msg);',
            '            DispatchMessageW(&msg);',
            '        }',
            '',
            '        if (GetAsyncKeyState(VK_F1) & 1) {',
            '            if (ipc) { ipc->targetFps = 240.0f; ipc->forceFlush = 1; }',
            '            std::printf(" [>] Che do FPS: 240.0 FPS LOCK + 10x Frame-Perfect\n");',
            '        }',
            '        if (GetAsyncKeyState(VK_F2) & 1) {',
            '            if (ipc) { ipc->targetFps = 360.0f; ipc->forceFlush = 1; }',
            '            std::printf(" [>] Che do FPS: 360.0 FPS BYPASS + 10x Frame-Perfect\n");',
            '        }',
            '        if (GetAsyncKeyState(VK_F3) & 1) {',
            '            if (ipc) { ipc->targetFps = 480.0f; ipc->forceFlush = 1; }',
            '            std::printf(" [>] Che do FPS: 480.0 FPS BYPASS + 10x Frame-Perfect\n");',
            '        }',
            '        if (GetAsyncKeyState(VK_F4) & 1) {',
            '            if (ipc) {',
            '                if (ipc->subFrameMult == 4) ipc->subFrameMult = 8;',
            '                else if (ipc->subFrameMult == 8) ipc->subFrameMult = 10;',
            '                else ipc->subFrameMult = 4;',
            '                ipc->forceFlush = 1;',
            '                std::printf(" [>] Do nhay Frame-Perfect Sub-Frame: %ux (%u Hz Precision)\n",',
            '                            ipc->subFrameMult, ipc->subFrameMult * 240);',
            '            }',
            '        }',
            '        if (GetAsyncKeyState(VK_F5) & 1) {',
            '            if (ipc) {',
            '                ipc->antiTearMode = (ipc->antiTearMode == 0) ? 1 : 0;',
            '                ipc->forceFlush = 1;',
            '                DWORD pid = FindGeometryDashPID();',
            '                EnforceExternalDwmAntiTear(pid, ipc->antiTearMode != 0);',
            '                if (hAnchor) ShowWindow(hAnchor, (ipc->antiTearMode != 0) ? SW_SHOWNOACTIVATE : SW_HIDE);',
            '                std::printf(" [>] DWM Mailbox Anti-Tear (Xoa soc nhieu): %s\n",',
            '                            (ipc->antiTearMode != 0) ? "BAT (ON)" : "TAT (OFF)");',
            '            }',
            '        }',
            '        if (GetAsyncKeyState(VK_F6) & 1) {',
            '            DWORD pid = FindGeometryDashPID();',
            '            BoostGeometryDashAndWindows(pid, true);',
            '            if (ipc) { ipc->forceFlush = 1; }',
            '            std::printf(" [>] Da giai phong RAM ngam cho may 8GB! (Tong pha Click 2400Hz da xu ly: %u)\n",',
            '                        ipc ? ipc->detectedClicks : 0);',
            '        }',
            '',
            '        if (++tick >= 20) {',
            '            tick = 0;',
            '            DWORD pid = FindGeometryDashPID();',
            '            if (pid != 0 && pid != lastPid) {',
            '                lastPid = pid;',
            '                BoostGeometryDashAndWindows(pid, true);',
            '                EnforceExternalDwmAntiTear(pid, ipc ? (ipc->antiTearMode != 0) : true);',
            '                std::printf(" [+] Da ket noi GeometryDash.exe (PID: %lu) - Da kich hoat Anti-Tear & 10x Frame-Perfect!\n", pid);',
            '            } else if (pid == 0 && lastPid != 0) {',
            '                lastPid = 0;',
            '                std::printf(" [-] GeometryDash.exe da dong. Dang cho mo lai game...\n");',
            '            }',
            '        }',
            '        Sleep(40);',
            '    }',
            '    return 0;',
            '}'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$extSrcDir/booster.cpp", $extCpp, (New-Object System.Text.UTF8Encoding($false)))

          $extCmake = @(
            'cmake_minimum_required(VERSION 3.21)',
            'project(GDExternalBooster LANGUAGES CXX)',
            'set(CMAKE_CXX_STANDARD 20)',
            'add_executable(GD-External-FPS-Booster booster.cpp)'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$extSrcDir/CMakeLists.txt", $extCmake, (New-Object System.Text.UTF8Encoding($false)))

          cmake -S "$extSrcDir" -B "$extBldDir" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$extBldDir" --config Release
          $exeFile = Get-ChildItem -Path "$extBldDir" -Filter "GD-External-FPS-Booster.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exeFile) {
            Copy-Item $exeFile.FullName "artifact_out/GD-External-FPS-Booster.exe" -Force
          }

          # 2. Kiểm tra và đóng gói file .geode
          $geodeFiles = @(Get-ChildItem -Path . -Filter "*.geode" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "artifact_out" })
          if ($geodeFiles.Count -gt 0) {
            Ensure-LogoInGeodePackage $geodeFiles[0].FullName
            Copy-Item $geodeFiles[0].FullName "artifact_out/yingseo.true480fps.geode" -Force
            exit 0
          }

          Write-Host "Running Self-Healing Rebuild..."
          $sdkPath = $env:GEODE_SDK
          if (!$sdkPath -or !(Test-Path $sdkPath)) {
            $foundCmake = Get-ChildItem -Path "C:\" -Filter "GeodeFile.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundCmake) {
              $sdkPath = $foundCmake.Directory.Parent.FullName
              $env:GEODE_SDK = $sdkPath
            }
          }

          if ($sdkPath -and (Test-Path "$sdkPath/VERSION")) {
            $diskGeodeVer = (Get-Content "$sdkPath/VERSION" -Raw).Trim() -replace '^v',''
            $diskGdVer = "2.2081"
            if (Test-Path "$sdkPath/CMakeLists.txt") {
              $sdkCmake = Get-Content "$sdkPath/CMakeLists.txt" -Raw
              if ($sdkCmake -match 'GEODE_GD_VERSION\s+"?([0-9\.]+)"?') {
                $diskGdVer = $Matches[1]
              }
            }
            $json = Get-Content "mod.json" -Raw | ConvertFrom-Json
            $json.geode = $diskGeodeVer
            $json.gd.win = $diskGdVer
            $modStr = $json | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText("$PWD/mod.json", $modStr, (New-Object System.Text.UTF8Encoding($false)))
          }

          if (Test-Path "build") { Remove-Item "build" -Recurse -Force }
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          cmake --build build --config Release

          $geodeFiles = @(Get-ChildItem -Path . -Filter "*.geode" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "artifact_out" })
          if ($geodeFiles.Count -gt 0) {
            Ensure-LogoInGeodePackage $geodeFiles[0].FullName
            Copy-Item $geodeFiles[0].FullName "artifact_out/yingseo.true480fps.geode" -Force
            exit 0
          }

          Write-Error "Failed to produce .geode package."
          exit 1

      - name: Upload Mod and External Tool Suite
        uses: actions/upload-artifact@v4
        with:
          name: True240FPS-Suite-v20
          path: artifact_out/*
