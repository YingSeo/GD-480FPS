name: Build Geode Mod
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync mod.json and Project Structure for Geode v5
        shell: pwsh
        run: |
          if (!(Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" | Out-Null
          }
          if (Test-Path "main.cpp") {
            Copy-Item "main.cpp" "src/main.cpp" -Force
          }

          $latestGeode = "5.11.2"
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/geode/releases/latest" -TimeoutSec 15
            if ($rel.tag_name) {
              $latestGeode = $rel.tag_name -replace '^v',''
            }
          } catch {
            Write-Host "Using Geode v5 version: $latestGeode"
          }

          $modJson = [ordered]@{
            geode = $latestGeode
            gd = @{
              win = "2.2081"
            }
            id = "yingseo.true480fps"
            name = "True 480+ FPS Overdrive"
            version = "v8.0.0"
            developer = "YingSeo"
            description = "True 480+ FPS Unlocker, Frame-Perfect Bypass, Anti-Blur/MSAA and Win11 0.5ms Kernel Boost."
            "early-load" = $true
          } | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$PWD/mod.json", $modJson, (New-Object System.Text.UTF8Encoding($false)))

          $cmake = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            'project(True480FPSMod VERSION 8.0.0 LANGUAGES C CXX)',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'if (WIN32)',
            '    target_link_libraries(${PROJECT_NAME} PRIVATE user32 gdi32 opengl32)',
            'endif()',
            'setup_geode_mod(${PROJECT_NAME})'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$PWD/CMakeLists.txt", $cmake, (New-Object System.Text.UTF8Encoding($false)))

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload Geode Package
        uses: actions/upload-artifact@v4
        with:
          name: True480FPS-Overdrive-v8
          path: ${{ steps.build.outputs.build-output }}
